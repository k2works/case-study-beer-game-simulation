name: beer-game-rust

# beer-game-rust の CI（検証のみ。デプロイはしない）。
# 設計: docs/design/beer-game-rust/test-strategy.md「CI との連携」、docs/development/beer-game-rust/bolt_1_plan.md の Step 1
#
# 工程: fmt・clippy・test（受け入れ・守りの検査を含む）・カバレッジのゲート（行 80%）・deny。
# actions の版: checkout は beer-game3.yml と同じ SHA 固定。Rust のツールチェーンは rust-toolchain.toml（1.97.1）が正。

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/beer-game-rust/**'
      - 'apps/beer-game-features/**'
      - 'apps/beer-game-web/**'
      - 'apps/beer-game-contracts/**'
      - '.github/workflows/beer-game-rust.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/beer-game-rust/**'
      - 'apps/beer-game-features/**'
      - 'apps/beer-game-web/**'
      - 'apps/beer-game-contracts/**'
      - '.github/workflows/beer-game-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beer-game-rust-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/beer-game-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # キャッシュ（B3 で導入）: ツール（cargo-llvm-cov・cargo-deny は毎回ソースからビルドすると約 10 分かかる）と、依存のビルド成果物。
      # キーは Cargo.lock と rust-toolchain.toml のハッシュ。復元しても、検査はすべて実行する（結果は変わらない）。
      - name: キャッシュ（cargo のツール・レジストリ・ビルド成果物）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/beer-game-rust/target
          key: beer-game-rust-${{ runner.os }}-${{ hashFiles('apps/beer-game-rust/Cargo.lock', 'apps/beer-game-rust/rust-toolchain.toml') }}
          restore-keys: |
            beer-game-rust-${{ runner.os }}-
      - name: ツールチェーン（rust-toolchain.toml の版）
        run: rustup show active-toolchain || rustup toolchain install
      - name: 書式
        run: cargo fmt --check
      - name: 静的解析（clippy。警告はすべて失敗）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: テスト
        run: cargo test --workspace --locked
      - name: 受入条件とテストの対応表（DS-11。guards のテストが生成）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ac-test-map
          path: apps/beer-game-rust/target/ac-test-map.md
          if-no-files-found: ignore
      - name: カバレッジのゲート（行 80% 未満で失敗。RT3）
        run: |
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo llvm-cov --workspace --locked --fail-under-lines 80 --summary-only
      - name: domain の行カバレッジ 100%（domain 自身のテストだけで）
        run: cargo llvm-cov -p beergame-domain --locked --fail-under-lines 100 --summary-only
      - name: 依存関係の検査（cargo-deny。開発時のみの依存も検査する）
        run: |
          command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.21.0 --locked
          cargo deny check

  # コンテナ（検証のみ。AWS 無関係）: イメージをビルドし、スモークテスト（/ready・/health・HEALTHCHECK・migrate・終了コード・非 root・SIGTERM）。
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: イメージのビルド
        run: docker build -t beer-game-rust:smoke apps/beer-game-rust
      - name: スモークテスト
        run: apps/beer-game-rust/scripts/container-smoke.sh beer-game-rust:smoke

  # Terraform の定義の検証（適用はしない。AWS 無関係）。beer-game2.yml と同じ action（版のタグ指定。SHA は未固定）。
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - name: fmt
        run: terraform fmt -recursive -check apps/beer-game-rust/infra
      - name: staging の validate（バックエンドなし）
        working-directory: apps/beer-game-rust/infra/envs/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: production の validate（バックエンドなし）
        working-directory: apps/beer-game-rust/infra/envs/production
        run: |
          terraform init -backend=false -input=false
          terraform validate
