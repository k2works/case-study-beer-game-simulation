name: beer-game-ts

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/beer-game-ts/**'
      # 画面・受け入れの仕様・API の契約は、Kotlin 版・Rust 版と共有する（e2e ジョブが、TS 版のバックエンドで実行する）
      - 'apps/beer-game-web/**'
      - 'apps/beer-game-features/**'
      - 'apps/beer-game-contracts/**'
      - '.github/workflows/beer-game-ts*.yml'
  pull_request:
    paths:
      - 'apps/beer-game-ts/**'
      - 'apps/beer-game-web/**'
      - 'apps/beer-game-features/**'
      - 'apps/beer-game-contracts/**'
      - '.github/workflows/beer-game-ts*.yml'

concurrency:
  group: beer-game-ts-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://beer_game2:local-only@localhost:5433/beer_game2

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/beer-game-ts
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: beer_game2
          POSTGRES_USER: beer_game2
          POSTGRES_PASSWORD: local-only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U beer_game2"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/beer-game-ts/.nvmrc
          cache: npm
          cache-dependency-path: apps/beer-game-ts/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run acceptance > /dev/null
      # ガイドツアーが、コードのタグと一致している（Living Documentation）
      - run: npm run docs:tour:check
      # イベント一覧・用語集・コアのハイライトが、コードと一致し、設計書の表と矛盾しない（Living Documentation）
      - run: npm run docs:living:check
      # 本番に入る依存の脆弱性（開発依存は対象外）
      - run: npm audit --omit=dev --audit-level=high

  # 共有の画面（apps/beer-game-web）の受け入れ @ui（Cucumber-JS + Playwright。27 シナリオ）を、TS 版のバックエンドで実行する
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: beer_game2
          POSTGRES_USER: beer_game2
          POSTGRES_PASSWORD: local-only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U beer_game2"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/beer-game-ts/.nvmrc
          cache: npm
          cache-dependency-path: apps/beer-game-ts/package-lock.json
      - run: npm ci
        working-directory: apps/beer-game-ts
      - run: npm run migrate
        working-directory: apps/beer-game-ts
      # バックエンドを、専用のポート 3100 で起動する（画面の Origin を許可する。web/support/hooks.mjs の案内と同じ）。
      # 受け入れはすべて同じ送信元から参加するので、参加・復帰の上限を緩める。http の Cookie を受けるため Secure は付けない
      - name: バックエンドの起動
        working-directory: apps/beer-game-ts
        env:
          PORT: '3100'
          ALLOWED_ORIGINS: http://localhost:5273
          COOKIE_SECURE: 'false'
          AUTH_RATE_LIMIT_PER_MINUTE: '10000'
          LOG_LEVEL: warn
        run: nohup npm run start > ../app.log 2>&1 &
      - name: バックエンドの準備の待機
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/v1/ready > /dev/null; then echo "起動を確認（${i} 回目）"; exit 0; fi
            sleep 1
          done
          echo "::error::バックエンドが起動しませんでした"; cat apps/app.log; exit 1
      - run: npm ci
        working-directory: apps/beer-game-web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/beer-game-web
      # Undefined・Pending のステップがあれば、Cucumber-JS が失敗にする（strict が既定）
      - run: npm run acceptance
        working-directory: apps/beer-game-web
      - name: バックエンドのログ（失敗したとき）
        if: failure()
        run: cat apps/app.log || true

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/beer-game-ts
    steps:
      - uses: actions/checkout@v5
      # 本番用イメージ: 非 root、開発依存なし、マイグレーション、/ready、DB 停止で 503
      - run: npm run container:check

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/beer-game-ts/infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      # 認証情報なしで行える検査（plan / apply は人が行う）
      - run: terraform fmt -recursive -check
      - run: terraform init -backend=false -input=false
        working-directory: apps/beer-game-ts/infra/envs/staging
      - run: terraform validate
        working-directory: apps/beer-game-ts/infra/envs/staging
      - run: terraform init -backend=false -input=false
        working-directory: apps/beer-game-ts/infra/envs/production
      - run: terraform validate
        working-directory: apps/beer-game-ts/infra/envs/production

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x -S warning apps/beer-game-ts/scripts/*.sh apps/beer-game-ts/scripts/deploy/*.sh
