# beer-game-kotlin のステージングへのデプロイ（手動起動のみ）。
#
# 状態: **AWS で実行していない・検証していない定義。** 書いただけで、一度も動かしていない（YAML の構文検証のみ）。
# AWS の準備（Terraform の適用、OIDC、変数の設定）ができてから、docs/operation/beer-game-kotlin/deploy.md の手順に沿って
# 人が手動で起動し、動作を確認する。確認したうえで、`push` トリガー（main へのマージ）を有効にするかを、人が判断する。
# 設計: docs/design/beer-game-kotlin/architecture-infrastructure.md「CI/CD」、operation.md「デプロイ」。
#
# 順序: ビルド → ECR への push → 新しいタスク定義の登録 → migrate（1 回限りの ECS タスク。完了待ち。失敗したら中止）
#       → api サービスの更新（サーキットブレーカー付きのローリング）→ 静的ファイルの公開 → スモークテスト
#       → 失敗したら、直前のタスク定義と静的ファイルの版へ自動で戻す。
# マイグレーションは戻さない（拡張 → 互換 → 縮小。旧アプリと互換にする。rollback.md の 2 段階リリースを参照）。
#
# 必要な変数（Settings > Environments > staging の Variables。値は terraform output から。ワークフローに値を書かない）:
#   AWS_ROLE_ARN（deploy_role_arn）  AWS_REGION  ECR_REPOSITORY（ECR のリポジトリ名。ecr_repository_url の最後の部分）
#   ECS_CLUSTER（ecs_cluster）  ECS_SERVICE（ecs_service）  API_TASK_FAMILY（api_task_family）  MIGRATE_TASK_FAMILY（migrate_task_family）
#   WEB_BUCKET（web_bucket）  DISTRIBUTION_ID（distribution_id）  TASK_SG（task_security_group_id）
#   TASK_SUBNETS（task_subnet_ids をカンマ区切りで）  STAGING_URL（url。スモークテストの宛先）
name: beer-game-kotlin-deploy-staging

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['apps/beer-game-kotlin/**']

concurrency:
  group: beer-game-kotlin-deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC（長期のアクセスキーは使わない）
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # イメージのビルド（初回は約 6 分）、migrate、ローリング更新、スモークテストを見込む。実測は未確認（AWS で未実行）
    timeout-minutes: 45
    # OIDC の信頼の条件（repo:<リポジトリ>:environment:staging）と対応する。名前を変えると、AWS を引き受けられなくなる
    environment: staging
    defaults:
      run:
        working-directory: apps/beer-game-kotlin
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      API_TASK_FAMILY: ${{ vars.API_TASK_FAMILY }}
      MIGRATE_TASK_FAMILY: ${{ vars.MIGRATE_TASK_FAMILY }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      TASK_SUBNETS: ${{ vars.TASK_SUBNETS }}
      TASK_SG: ${{ vars.TASK_SG }}
      BASE_URL: ${{ vars.STAGING_URL }}
      RELEASE_ID: ${{ github.sha }}
    steps:
      # SHA は beer-game-kotlin.yml と同じ（固定済み）。configure-aws-credentials・amazon-ecr-login は、固定する SHA を確認できていないため版のタグ（未固定）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/beer-game-kotlin/web/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 切り戻しの先を、更新の前に記録する（api のタスク定義と、公開中の静的ファイルの版）
      - name: 直前の版を記録
        id: previous
        run: |
          PREV_TD="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)"
          PREV_KEY="$(aws s3api list-objects-v2 --bucket "$WEB_BUCKET" --prefix deployments/ \
            --query 'reverse(sort_by(Contents, &Key))[0].Key' --output text 2>/dev/null || true)"
          PREV_RELEASE=""
          if [ -n "$PREV_KEY" ] && [ "$PREV_KEY" != "None" ]; then
            PREV_RELEASE="$(aws s3 cp "s3://$WEB_BUCKET/$PREV_KEY" - --only-show-errors | jq -r .release)"
          fi
          echo "直前の api タスク定義: $PREV_TD / 直前の静的ファイルの版: ${PREV_RELEASE:-なし}"
          echo "task_definition=$PREV_TD" >> "$GITHUB_OUTPUT"
          echo "release=$PREV_RELEASE" >> "$GITHUB_OUTPUT"

      # イメージは一度だけビルドし、コミット SHA のタグで ECR へ（タグは不変）。以降は**ダイジェスト**で固定する
      - name: イメージをビルドして ECR へ
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_ID" >/dev/null 2>&1; then
            echo "同じコミットのイメージが既にあるため、再利用する"
          else
            docker build -t "$REGISTRY/$REPOSITORY:$RELEASE_ID" .
            docker push "$REGISTRY/$REPOSITORY:$RELEASE_ID"
          fi
          DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_ID" \
            --query 'imageDetails[0].imageDigest' --output text)"
          echo "image=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "イメージ: $REGISTRY/$REPOSITORY@$DIGEST（本番へ昇格するときの入力）"

      # 現在のタスク定義を元に、イメージだけを差し替えた新しい版を登録する（api と migrate は同じイメージ）
      - name: タスク定義の登録
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          register() {
            local family="$1" tmp
            tmp="$(mktemp)"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition --output json \
              | jq --arg image "$IMAGE" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
                  | .containerDefinitions[0].image = $image' > "$tmp"
            aws ecs register-task-definition --cli-input-json "file://$tmp" \
              --query taskDefinition.taskDefinitionArn --output text
          }
          echo "api=$(register "$API_TASK_FAMILY")" >> "$GITHUB_OUTPUT"
          echo "migrate=$(register "$MIGRATE_TASK_FAMILY")" >> "$GITHUB_OUTPUT"

      # マイグレーション: 1 回限りの ECS タスク（モード migrate）。完了を待ち、終了コードが 0 でなければ中止する（api は更新しない）
      - name: マイグレーション（migrate タスク）
        env:
          MIGRATE_TD: ${{ steps.taskdef.outputs.migrate }}
        run: |
          TASK_ARN="$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$MIGRATE_TD" \
            --network-configuration "awsvpcConfiguration={subnets=[$TASK_SUBNETS],securityGroups=[$TASK_SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)"
          echo "migrate タスク: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::マイグレーションに失敗しました（終了コード: $EXIT_CODE）。デプロイを中止します。ログ: CloudWatch Logs の /ecs/<名前>/migrate"
            exit 1
          fi
          echo "マイグレーションが完了しました（終了コード 0）"

      # api の更新。サービスのサーキットブレーカー（rollback 有効）が、健全にならない新しい版を直前の版へ戻す
      - name: api サービスの更新
        id: update
        env:
          API_TD: ${{ steps.taskdef.outputs.api }}
        run: |
          echo "updated=true" >> "$GITHUB_OUTPUT"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$API_TD" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          ROLLOUT="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" --output text)"
          if [ "$ROLLOUT" != "COMPLETED" ]; then
            echo "::error::ローリング更新が完了しませんでした（rolloutState: $ROLLOUT）"
            exit 1
          fi

      # 静的ファイル（web/dist）を releases/<SHA>/ に置き、current に反映する
      - name: 静的ファイルの公開
        id: web
        working-directory: apps/beer-game-kotlin/web
        run: |
          echo "published=true" >> "$GITHUB_OUTPUT"
          npm ci
          npm run build
          aws s3 sync dist "s3://$WEB_BUCKET/releases/$RELEASE_ID/" --delete --only-show-errors
          aws s3 sync "s3://$WEB_BUCKET/releases/$RELEASE_ID/" "s3://$WEB_BUCKET/current/" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' >/dev/null

      # スモークテスト: 公開 URL 経由で /api/v1/ready（準備。DB と通知の受信）と /api/v1/health（生存）が 200
      # 自動確定を含む業務のスモーク（設計: 作成・参加・SSE・ポーリング・自動確定）は未実装（未確認）
      - name: スモークテスト
        run: |
          [ -n "$BASE_URL" ] || { echo "::error::STAGING_URL が未設定です"; exit 1; }
          check() {
            local path="$1" i code
            for i in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$BASE_URL$path" || true)"
              if [ "$code" = "200" ]; then echo "ok: $path"; return 0; fi
              echo "待機 $i/30: $path -> $code"; sleep 5
            done
            echo "::error::$path が 200 になりません（最後: $code）"; return 1
          }
          check /api/v1/ready
          check /api/v1/health

      - name: デプロイの履歴を記録（ロールバックの候補）
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          API_TD: ${{ steps.taskdef.outputs.api }}
          MIGRATE_TD: ${{ steps.taskdef.outputs.migrate }}
        run: |
          jq -n --arg release "$RELEASE_ID" --arg image "$IMAGE" --arg api "$API_TD" --arg migrate "$MIGRATE_TD" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{release: $release, image: $image, apiTaskDefinition: $api, migrateTaskDefinition: $migrate, deployedAt: $at}' \
            | aws s3 cp - "s3://$WEB_BUCKET/deployments/$(date -u +%Y%m%dT%H%M%SZ)-$RELEASE_ID.json" --only-show-errors

      # 失敗時の自動ロールバック: 直前のタスク定義と静的ファイルの版へ戻す。マイグレーションは戻さない
      - name: 失敗時のロールバック（直前の版へ）
        if: failure() && steps.update.outputs.updated == 'true'
        env:
          PREV_TD: ${{ steps.previous.outputs.task_definition }}
          PREV_RELEASE: ${{ steps.previous.outputs.release }}
        run: |
          echo "::warning::失敗したため、直前の版へ戻します（マイグレーションは戻しません）"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$PREV_TD" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          if [ "${{ steps.web.outputs.published }}" = "true" ] && [ -n "$PREV_RELEASE" ]; then
            aws s3 sync "s3://$WEB_BUCKET/releases/$PREV_RELEASE/" "s3://$WEB_BUCKET/current/" --delete --only-show-errors
            aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' >/dev/null
          fi
          echo "直前の版（$PREV_TD）へ戻しました。実行自体は失敗のままです。原因を調べてください"
