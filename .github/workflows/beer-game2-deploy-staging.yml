# ステージングへのデプロイ（手動起動のみ）。
# まだ AWS で実行・検証していない。AWS の準備ができてから、手順書に沿って変数を設定し、
# 動作を確認したうえで、`push` トリガー（main へのマージ）を有効にする。
name: beer-game2-deploy-staging

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['apps/beer-game2/**']

concurrency:
  group: beer-game2-deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC（長期のアクセスキーは使わない）
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: apps/beer-game2
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      API_TASK_FAMILY: ${{ vars.API_TASK_FAMILY }}
      MIGRATE_TASK_FAMILY: ${{ vars.MIGRATE_TASK_FAMILY }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      TASK_SUBNETS: ${{ vars.TASK_SUBNETS }}
      TASK_SG: ${{ vars.TASK_SG }}
      RELEASE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/beer-game2/.nvmrc
          cache: npm
          cache-dependency-path: apps/beer-game2/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # イメージは一度だけビルドし、コミット SHA のタグで ECR へ（タグは不変）。以降はダイジェストで固定する
      - name: イメージをビルドして ECR へ
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_ID" >/dev/null 2>&1; then
            echo "同じコミットのイメージが既にあるため、再利用する"
          else
            docker build -t "$REGISTRY/$REPOSITORY:$RELEASE_ID" .
            docker push "$REGISTRY/$REPOSITORY:$RELEASE_ID"
          fi
          DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_ID" \
            --query 'imageDetails[0].imageDigest' --output text)"
          echo "image=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build:ui

      - name: デプロイ（マイグレーション → ローリング更新 → 静的ファイル）
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: bash scripts/deploy/deploy.sh

      - name: スモークテスト
        env:
          API_URL: ${{ vars.STAGING_URL }}
          ORIGIN: ${{ vars.STAGING_URL }}
        run: npx tsx scripts/smoke.ts
