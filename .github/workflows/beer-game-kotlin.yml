name: beer-game-kotlin

# beer-game-kotlin の CI（検証のみ。デプロイはしない）。
# 設計: docs/development/beer-game-kotlin/bolt_1_plan.md の Step 2

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/beer-game-kotlin/**'
      - '.github/workflows/beer-game-kotlin.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/beer-game-kotlin/**'
      - '.github/workflows/beer-game-kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beer-game-kotlin-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/beer-game-kotlin

jobs:
  verify:
    name: verify（ktlint・test・モジュール依存）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # detekt は JDK 25 で動かないため、別のジョブ（detekt）で実行する。ここでは自動で無効になる。
      - name: ktlint・test・モジュール依存の検査・Kover
        run: ./gradlew check koverXmlReport --no-daemon

  detekt:
    name: detekt（JDK 21）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # detekt 1.23.8 は JDK 25 で動かない（同梱の Kotlin コンパイラが 25.0.x を解釈できない）。B2 で代替を判断する。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: detekt（ForbiddenMethodCall を含む。違反は 0 件）
        run: ./gradlew detekt detektMain detektTest --no-daemon

  integration:
    name: integrationTest（PostgreSQL 18）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers が PostgreSQL 18 のコンテナを起動する（runner の Docker を使う）。Step 2 の時点では試験は無い。
      - name: integrationTest
        run: ./gradlew integrationTest --no-daemon
