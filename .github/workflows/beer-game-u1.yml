name: beer-game-u1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beer_game_u5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/beer-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/beer-game/package-lock.json
      - run: npm ci
      - run: psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE beer_game_u4_test'
        env:
          PGPASSWORD: test
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          GAME_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/beer_game_u5_test
          RETENTION_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/beer_game_u4_test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:u1
      - run: npm run e2e:u5
  staging:
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "OIDC-authenticated rolling deployment is performed by the environment task"
  production:
    needs: staging
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "Manual environment approval starts blue-green deployment and SLO bake"
