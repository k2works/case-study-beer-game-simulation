name: beer-game-u1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/beer-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/beer-game/package-lock.json
      - run: npm ci
      - run: npm run verify:u1
  staging:
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "OIDC-authenticated rolling deployment is performed by the environment task"
  production:
    needs: staging
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "Manual environment approval starts blue-green deployment and SLO bake"
