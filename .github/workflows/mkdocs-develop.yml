name: Deploy MkDocs (develop)

# develop ブランチのドキュメントを、gh-pages ブランチの develop/ に公開する。
# main の公開（ルート）とは別の場所なので、互いに上書きしない。
# 公開先の URL: https://<owner>.github.io/<repo>/develop/

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

# main 版と同じ gh-pages ブランチへ push するため、同時に実行しない（競合の防止）
concurrency:
  group: mkdocs-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build documentation
        run: npm run docs:build

      - name: Deploy to GitHub Pages (develop/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: develop
          # destination_dir の外（main の公開）を消さない
          keep_files: true
