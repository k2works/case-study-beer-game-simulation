          - 要件定義: requirements/beer-game/requirements_definition.md
          - ビジネスユースケース: requirements/beer-game/business_usecase.md
          - システムユースケース: requirements/beer-game/system_usecase.md
          - ユーザーストーリー: requirements/beer-game/user_story.md
