[package]
name = "beergame-adapter-persistence"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

build = "build.rs"

[dependencies]
beergame-application = { path = "../application" }
beergame-domain = { path = "../domain" }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "uuid", "time"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
testcontainers = "0.28.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
