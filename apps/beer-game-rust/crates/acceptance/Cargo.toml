[package]
name = "beergame-acceptance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 受け入れテストのクレート。共有する features/（日本語 Gherkin）を cucumber-rs で実行する。
# cucumber・tokio は、このクレートだけが持つ（domain の依存には含めない。DS-4）。
[dev-dependencies]
beergame-domain = { path = "../domain" }
cucumber = { version = "0.23.0", features = ["output-junit"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "acceptance"
harness = false

[lints]
workspace = true
