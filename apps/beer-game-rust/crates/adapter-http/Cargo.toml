[package]
name = "beergame-adapter-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
beergame-application = { path = "../application" }
beergame-domain = { path = "../domain" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = "1.29.3"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
