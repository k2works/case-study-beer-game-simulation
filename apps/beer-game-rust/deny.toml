# 依存関係の検査（設計: tech-stack の R4）。緩和は ADR で記録し、人が承認する。
[graph]
all-features = true
exclude-dev = false
exclude-unpublished = false

[advisories]
version = 2
# 暫定・人の承認待ち（開発戦略 DS-17。ADR で記録して承認を得る）:
# humantime は cucumber 0.23.0（開発時のみ）の依存で、chrono が非メンテナンスになったため非メンテナンスと報告された
# （脆弱性ではない。解決策なし）。承認されない場合は、cucumber の代替を検討する。
ignore = [
    { id = "RUSTSEC-2026-0542", reason = "cucumber（開発時のみ）の依存。脆弱性ではなく非メンテナンスの報告。人の承認待ち" },
    # astral-tokio-tar は testcontainers 0.28.0（開発時のみ）の依存。非メンテナンスの報告（解決策なし）。人の承認待ち。
    { id = "RUSTSEC-2026-0440", reason = "testcontainers（開発時のみ）の依存。脆弱性ではなく非メンテナンスの報告。人の承認待ち" },
]

[licenses]
version = 2
# 開発時のみの依存も検査する（既定は検査しない）
include-dev = true
# BlueOak-1.0.0 は cucumber（開発時のみ）の依存 synthez の許可。寛容な OSI 承認のライセンスだが、
# 許可の追加は DS-17 の対象なので、暫定・人の承認待ち。
# ISC・BSD-3-Clause・Zlib は sqlx・axum・testcontainers の依存（rustls・ring・subtle・matchit・foldhash）の許可。
# いずれも寛容な OSI 承認のライセンスだが、許可の追加は DS-17 の対象なので、暫定・人の承認待ち。
# MIT-0 は、契約テストの jsonschema（開発時のみ）の推移依存 borrow-or-share のライセンス（2026-11-22 にユーザーが承認）
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BlueOak-1.0.0", "ISC", "BSD-3-Clause", "Zlib", "MIT-0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ワークスペース内の path 依存は版を書かない
allow-wildcard-paths = true
