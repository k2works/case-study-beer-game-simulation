# domain モジュールだけに加える設定。時計・乱数・ID の生成を禁止する（値はコマンドで受け取る）。
# ForbiddenMethodCall は型解決が要る（detektMain で動く）。
style:
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'java.time.Instant.now'
        reason: 'ドメインでは時計を読まない。時刻はコマンドの値で受け取る。'
      - value: 'java.time.LocalDateTime.now'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.time.LocalDate.now'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.time.OffsetDateTime.now'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.time.ZonedDateTime.now'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.time.Clock.systemUTC'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.time.Clock.systemDefaultZone'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.time.Clock.system'
        reason: 'ドメインでは時計を読まない。'
      - value: 'kotlin.time.Clock.System.now'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.util.UUID.randomUUID'
        reason: 'ドメインでは ID を生成しない。ID はコマンドの値で受け取る。'
      - value: 'java.util.Random.<init>'
        reason: 'ドメインでは乱数を使わない。'
      - value: 'kotlin.random.Random.Default.nextInt'
        reason: 'ドメインでは乱数を使わない。'
      - value: 'kotlin.random.Random.Default.nextLong'
        reason: 'ドメインでは乱数を使わない。'
      - value: 'kotlin.random.Random.Default.nextDouble'
        reason: 'ドメインでは乱数を使わない。'
      - value: 'kotlin.random.Random.<init>'
        reason: 'ドメインでは乱数を使わない。'
      - value: 'java.lang.System.currentTimeMillis'
        reason: 'ドメインでは時計を読まない。'
      - value: 'java.lang.System.nanoTime'
        reason: 'ドメインでは時計を読まない。'
      - value: 'kotlin.collections.mutableListOf'
        reason: '可変コレクションを使わない。'
      - value: 'kotlin.collections.mutableMapOf'
        reason: '可変コレクションを使わない。'
      - value: 'kotlin.collections.mutableSetOf'
        reason: '可変コレクションを使わない。'
