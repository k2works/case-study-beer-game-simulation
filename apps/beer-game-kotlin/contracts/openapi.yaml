openapi: 3.1.0
info:
  title: ビールゲームシミュレーション API（Kotlin 版）
  version: 0.1.0-b1
  description: |
    API の契約の正本（ADR-008。手書き。仕様が先）。本書は Bolt 1（ウォーキングスケルトン）の範囲だけを書く。
    経路・認可・エラーの写像は docs/design/beer-game-kotlin/architecture-backend.md の「API 設計方針」に従う。

    **設計書に項目が無いため、本書では確定していないもの（未決）**は、各所の description に「未決」と書いた。
    リクエスト・レスポンスの本文の詳細な項目（設定の項目名、状態の投影の項目名など）は、設計書が正本として
    定めていないため、最小限の形だけを置き、Step 4〜9 の実装で確定して本書を更新する。

    **Step 9（HTTP の実装）で、実装と照合して直した点**（手での照合。契約テストの自動化は B2）:
    受付終了後の参加は `game.not_preparing`（409）、作成は最終週と需要系列を必須、状態の問い合わせの項目名の確定、
    `?role=` の追加、`versions` の null、`/ready` の 503 は problem+json（`type` あり）、413・429 の追加、
    `Set-Cookie`（HttpOnly・SameSite=Strict）の明記。ログ・相関 ID・セキュリティヘッダーは全応答に付く。

    **Bolt 5 の Step 1（2026-11-15）で、継続と資格の経路を足し、Step 6（2026-11-15）で実装した**（ゲート 6 は人の確認待ち）:
    停止・再開・代理入力（`pauseSession`・`resumeSession`・`submitProxyDecision`）、資格の失効・再発行（`revokeCredential`・`reissueCredential`）、
    復帰（`recoverParticipation`）。参加・復帰の応答にゲームの ID（`gameId`。bolt_5_plan の判断項目 7）。
    新しい code: `session.paused`・`session.not_paused`・`session.save_limit_reached`・`game.credential_already_revoked`・`game.credential_not_revoked`。
    復帰資格の受け渡し（Cookie `bg_recovery` と、作成・再発行の応答に一度だけ示す復帰コード。H3 の案 A）、保存回数の上限の code、
    `session.not_paused` の 409 は、ゲート 1 で決定済み（各所の「提案」は、その決定を指す）。
    ブラウザセッションの Cookie（`bg_session`）の `Max-Age` は、サーバー側の有効期限（既定 24 時間）と同じ値。復帰資格の Cookie（`bg_recovery`）は 30 日。
    役割の入れ替え〔開始後の `assignRole`〕の形は、ゲート 1 で提案どおりに決定し、規則の細部は `assignRole` の description に書いた（Step 6 で実装）。
servers:
  - url: /api/v1
tags:
  - name: ゲーム
  - name: 参加
  - name: 進行
  - name: 意思決定
  - name: 資格
  - name: 観察
  - name: 運用
paths:
  /games:
    post:
      tags: [ゲーム]
      operationId: createGame
      summary: ゲームを作成する（CreateGame。game ストリーム）
      description: 認可は誰でも可（匿名）。キット準拠の設定で、参加コード付きの準備中のゲームを一度だけ作成する（AC1.1.1）。無効な需要系列などは、作成せず、項目ごとの誤りを集めて 422 で返す（AC1.1.2）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: |
            作成した。ゲームの ID は Location で、参加コードは進行役の状態の取得で得る（作成の応答に gameId を含めない）。進行役の資格を Set-Cookie で発行する。
            **B5 の提案（判断項目 9 の案 A。H3）**: 本文に、進行役の復帰コード `recoveryCode` を一度だけ示す（保存は鍵付きダイジェストだけで、再表示しない）。
            進行役は、これを控えておき、端末を替えたときに `recoverParticipation` で復帰する。復帰資格は Cookie `bg_recovery` でも発行する。
          headers:
            Location:
              description: 作成したゲームの状態の URL（`/api/v1/games/{gameId}/state`）
              schema: { type: string }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGameResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/lobby:
    get:
      tags: [ゲーム]
      operationId: getLobby
      summary: ロビーを取得する（問い合わせ。lobby_* の投影）
      description: |
        認可は進行役。B1 の実装は進行役だけで、参加者には（資格の失敗と同じ）403 を返す（参加者向けのロビー＝参加コード・割り当てを含まない一覧は、読み取りの型に項目が無く、未実装。ui-design S04）。
        本文の項目は、投影の表（lobby_*）から書き出す。
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: ロビー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/observation:
    get:
      tags: [観察]
      operationId: getObservation
      summary: プレイ中の観察（現在週・完了状況・チーム合計。B9）
      description: |
        認可は**観察者と進行役**（AC4.1.4）。参加者・資格の無い人・別のゲーム・存在しないゲームは、資格の失敗と同じ 403（`app.unauthorized`）。
        内容は、現在週・入力済みの役割数・確定した週のチーム合計（注文・在庫・受注残）だけ。**役割別の値・将来の需要・参加コード・入力者は含まない**
        （BR-17。DB のロール `beergame_observer` が読める 3 表だけから作る）。
        公開範囲が「なし」（`NONE`）なら合計を出さず、`totals.hiddenReason` に理由（`DISCLOSURE_NONE`）を示す。
        寄与者が 2 未満の週は、値を出さず、`hidden` と理由（`CONTRIBUTORS_BELOW_MINIMUM`）だけを返す（逆算の防止。AC4.1.3）。
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: 観察の内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/observer-invitations:
    post:
      tags: [観察]
      operationId: inviteObserver
      summary: 観察用の招待を発行する（InviteObserver。game ストリーム。B9）
      description: |
        認可は進行役（AC1.3.2。進行役以外は 403）。参加コードとは別の乱数・別のダイジェストの**招待コード**を発行し、
        **招待コードと招待の ID・有効期限を、この応答で一度だけ示す**（保存はダイジェストだけ。再表示しない。イベントには招待の ID と期限だけを入れる）。
        招待の有効期間は 7 日（設計の未決の仮置き）。準備中と開始後の両方で受け付ける。本文は空か `{}`。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteObserverResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/observer-invitations/{invitationId}/revoke:
    post:
      tags: [観察]
      operationId: revokeObserverInvitation
      summary: 観察用の招待を失効させる（RevokeObserverInvitation。game ストリーム。B9）
      description: |
        認可は進行役。以降、その招待での新しい参加はできない（AC1.3.4。`game.invitation_invalid`）。**すでに参加した観察者は、そのまま観察を続けられる**。
        すでに失効していれば `game.credential_already_revoked`（409）。このゲームに無い招待は `game.invitation_not_found`（404）。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 失効させた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /participations/observe:
    post:
      tags: [観察]
      operationId: joinAsObserver
      summary: 観察用の招待コードで、観察者として参加する（JoinAsObserver。game ストリーム。B9）
      description: |
        認可は招待コード。有効な招待コードと表示名で、観察者として参加する（AC1.3.3。役割を持たず、状態を変更できない）。
        不明・失効・期限切れ・形式不正の招待コードは、区別しない同じ 403（`game.invitation_invalid`。AC1.3.4。列挙の防止）。
        参加と同じ接続元ごとの失敗の窓で数える（NF-S11。上限を超えると 429）。
        観察者には、ブラウザセッション（`bg_session`）だけを Set-Cookie で発行する。**復帰資格は発行しない**（観察者の復帰は設計の未決）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinObserverRequest"
      responses:
        "200":
          description: 観察者として参加した。ブラウザセッションを Set-Cookie で発行する。
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinObserverResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/review:
    get:
      tags: [ゲーム]
      operationId: getReview
      summary: 終了後の振り返り（全役割の全週の結果。B4）
      description: |
        認可は進行役・参加者・観察者（B9。終了後は、他の役割の値を含む。学習の振り返りのため）。**ゲームが終了するまでは開示しない**（`game.not_ended`。409。AC4.2.2）。
        資格が無い・別のゲーム・存在しないゲームは、資格の失敗と同じ 403。需要は、小売店の `orders`（顧客からの注文）と同じ値。
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: 振り返り
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/exports:
    get:
      tags: [ゲーム]
      operationId: getExport
      summary: 終了後の結果の出力（CSV または JSON。B10。US4.3）
      description: |
        認可は**進行役だけ**。参加者・観察者・資格の無い人・別のゲーム・存在しないゲームは、区別せず 403（`app.unauthorized`）。
        **ゲームが終了するまでは出力しない**（`game.not_ended`。409）。`format` は必須で、省略・知らない形式は 422（`errors[].field` が `format`）。

        出力は、投影にせず、要求時に `week_role_results` と設定から作る（`buildExport`。表 `export_packages` は無い）。
        全体を組み立ててから 1 回で返す（ストリーミングしない）。組み立てられなければ、本文は返さず、problem+json（500 `app.internal`。AC4.3.3）。
        設定の種別（`KIT`・`CUSTOM`）と変更した項目、確定方式、全週・全役割の受注・出荷・発注（意思決定）・週末在庫・週末受注残・週次費用・累計費用を含む。
        **表示名・資格・参加コードは含めない**（NF-S14）。入力の保存の履歴（イベント）は含めない（bolt_10_plan の判断項目 6）。
        CSV は RFC 4180（CRLF）。文字列の列の先頭が `=`・`+`・`-`・`@`・タブ・CR のときは、先頭に `'` を付ける（表計算の数式として解釈させない）。
        JSON と CSV は、同じ記録から作るので、数量と費用は一致する（AC4.3.2）。スキーマ版は、CSV の各行の `schema_version`、JSON の `schemaVersion`、`X-Export-Schema-Version` に記録する。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
      responses:
        "200":
          description: 出力（ダウンロードとして返す）
          headers:
            Content-Disposition:
              description: '`attachment; filename="beer-game-{gameId}.csv|json"`'
              schema: { type: string }
            X-Export-Checksum:
              description: 本文（UTF-8 のバイト列）の SHA-256。`sha256-` と小文字の 16 進。形式ごとに別の値
              schema: { type: string }
            X-Export-Schema-Version:
              description: 出力の形の版（`beer-game-kotlin.export.v1`）
              schema: { type: string }
          content:
            text/csv:
              schema:
                type: string
                description: 見出しの行と、1 週 × 1 役割ごとの行（週の昇順、役割は上流から下流）。列は `schema_version,game_id,settings_kind,settings_changes,commit_mode,week,role,orders,shipped,ordered,ending_inventory,ending_backlog,weekly_cost_minor,cumulative_cost_minor`。
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDocument"
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/participants/{participantId}/role:
    put:
      tags: [ゲーム]
      operationId: assignRole
      summary: 役割を割り当てる（AssignRole。game ストリーム）
      description: |
        認可は進行役。1 人の参加者に同時に複数の役割は持たせない（AC1.2.5）。別の役割にいる人を選んだ場合は、付け替え（D9。移動元の RoleUnassigned と移動先の RoleAssigned）として扱う。
        **同じ役割に、複数の参加者を割り当てられる**（共同担当。AC1.2.4。準備中だけ。人数の上限は設けない。B6 で受入シナリオを足した。実装は B1 から変えない）。
        `DELETE` の UnassignRole（単独の解除）は B1 に含めない（bolt_1_plan 判断項目 13。未決）。

        **B5 の役割の入れ替え（H4。形はゲート 1 で決定済み。規則の細部は Step 3.5.1 で書いた。ゲート 3.5 は人の確認待ち）**:
        ゲームの開始後も、この操作を受け付ける。**すでに別の参加者が担当している役割へ、参加済み・未割り当ての参加者を割り当てる**ことを「入れ替え」とし、
        旧担当者の資格（復帰資格とブラウザセッション）は同じ操作で自動的に失効する（ブラウザセッションは、失効と同じトランザクションで行を削除する。ゲート 1 の H2 案 A）。
        旧担当者の履歴（週の入力の履歴）と入力者のラベルは残す。経路・メソッド・本文（`AssignRoleRequest`）・応答（`CommandResponse`）は、準備中の付け替え（D9）と同じである。

        - **進行役だけ**。進行役でなければ 403（`app.unauthorized`）。
        - 開始後の**同じ役割への割り当て直し**（その参加者がすでにその役割の担当）は、何も変わらないので 200 で、履歴（イベント）に足さず、版も進めない。
        - 担当者のいる役割へ、未割り当ての参加者を割り当てると、その役割の**現在の担当者全員**が入れ替わる（共同担当がいる場合も同じ。判断は設計書の「入れ替え」）。
        - 開始後の、これ以外の割り当て（**別の役割にいる人**の付け替えなど）は、従来どおり `game.not_preparing`（409）。
        - **資格がすでに失効している参加者**（以前に入れ替えられた旧担当者、手動で失効させた参加者）を割り当てようとすると、`game.credential_already_revoked`（409。新しい code は足さない）。
        - ゲームが**終了している**場合は `session.already_ended`（409）。進行中・一時停止中は受け付ける。
        - 存在しない参加者は `game.participant_not_found`（404）。
        - 開始後の新規参加は受け付けない（`joinGame` は準備中だけ）ため、入れ替えの対象は、**開始前に参加し、役割を持たなかった参加者**に限られる。
        - 準備中の挙動（付け替え・割り当て直し・解除の側のイベント）は、B1 の D9 から変えない。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/ParticipantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: 割り当てた（準備中の割り当て・付け替え、開始後の入れ替え、変化なしの割り当て直し）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /participations/join:
    post:
      tags: [参加]
      operationId: joinGame
      summary: 参加コードでゲームに参加する（JoinGame。game ストリーム）
      description: |
        認可は参加コード。有効な参加コードと表示名で、ロビーに参加し、復帰資格が保存される（AC1.2.1）。
        不明・形式不正の参加コードは、区別せず同じ 403（`game.invitation_invalid`）を返す（列挙の防止。AC1.2.2）。
        **受付が終了したゲーム（開始済み）の参加は、403 ではなく 409 `game.not_preparing`** で、理由（参加の受付を終了している）を示す
        （Gherkin AC1.2.2 の 2 つ目のシナリオに従う。設計書の「区別しない」との食い違いは、bolt_1_plan の Step 8 の食い違い 5 と Step 9 の結果に記録）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
