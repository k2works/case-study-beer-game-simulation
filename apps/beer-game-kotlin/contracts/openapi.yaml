      description: |
        認可は参加者（その役割の担当）。`If-Match` は意思決定の版（DecisionVersion）で、**このコマンドにだけ**付ける。
        入力する役割は、**資格から決まる**（本文に役割を持たない）。役割が無い操作者（進行役、役割が未割り当ての参加者）は、資格の失敗と同じ 403。
        流通役は発注、生産役（工場）は生産要請として保存する（AC2.2.1）。数量は 0〜1000 の整数（範囲外は 422 の quantity。
