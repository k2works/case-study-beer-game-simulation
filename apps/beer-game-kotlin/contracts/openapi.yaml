openapi: 3.1.0
info:
  title: ビールゲームシミュレーション API（Kotlin 版）
  version: 0.1.0-b1
  description: |
    API の契約の正本（ADR-008。手書き。仕様が先）。本書は Bolt 1（ウォーキングスケルトン）の範囲だけを書く。
    経路・認可・エラーの写像は docs/design/beer-game-kotlin/architecture-backend.md の「API 設計方針」に従う。

    **設計書に項目が無いため、本書では確定していないもの（未決）**は、各所の description に「未決」と書いた。
    リクエスト・レスポンスの本文の詳細な項目（設定の項目名、状態の投影の項目名など）は、設計書が正本として
    定めていないため、最小限の形だけを置き、Step 4〜9 の実装で確定して本書を更新する。

    **Step 9（HTTP の実装）で、実装と照合して直した点**（手での照合。契約テストの自動化は B2）:
    受付終了後の参加は `game.not_preparing`（409）、作成は最終週と需要系列を必須、状態の問い合わせの項目名の確定、
    `?role=` の追加、`versions` の null、`/ready` の 503 は problem+json（`type` あり）、413・429 の追加、
    `Set-Cookie`（HttpOnly・SameSite=Strict）の明記。ログ・相関 ID・セキュリティヘッダーは全応答に付く。

    **Bolt 5 の Step 1（2026-11-15）で、継続と資格の経路を足した（仕様が先。実装は無い。人の承認待ち）**:
    停止・再開・代理入力（`pauseSession`・`resumeSession`・`submitProxyDecision`）、資格の失効・再発行（`revokeCredential`・`reissueCredential`）、
    復帰（`recoverParticipation`）。参加・復帰の応答にゲームの ID（`gameId`。bolt_5_plan の判断項目 7）。
    新しい code: `session.paused`・`session.not_paused`・`session.save_limit_reached`・`game.credential_already_revoked`。
    **提案であって、決定ではないもの**（ゲート 1 で人が決める。各所に「提案」と書いた）: 復帰資格の受け渡し（Cookie `bg_recovery` と復帰コード。H3）、
    保存回数の上限の code・文言、役割の入れ替え（開始後の `assignRole`）の形、`session.not_paused` などの派生の code。
servers:
  - url: /api/v1
tags:
  - name: ゲーム
  - name: 参加
  - name: 進行
  - name: 意思決定
  - name: 資格
  - name: 運用
paths:
  /games:
    post:
      tags: [ゲーム]
      operationId: createGame
      summary: ゲームを作成する（CreateGame。game ストリーム）
      description: 認可は誰でも可（匿名）。キット準拠の設定で、参加コード付きの準備中のゲームを一度だけ作成する（AC1.1.1）。無効な需要系列などは、作成せず、項目ごとの誤りを集めて 422 で返す（AC1.1.2）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: |
            作成した。ゲームの ID は Location で、参加コードは進行役の状態の取得で得る（作成の応答に gameId を含めない）。進行役の資格を Set-Cookie で発行する。
            **B5 の提案（判断項目 9 の案 A。H3）**: 本文に、進行役の復帰コード `recoveryCode` を一度だけ示す（保存は鍵付きダイジェストだけで、再表示しない）。
            進行役は、これを控えておき、端末を替えたときに `recoverParticipation` で復帰する。復帰資格は Cookie `bg_recovery` でも発行する。
          headers:
            Location:
              description: 作成したゲームの状態の URL（`/api/v1/games/{gameId}/state`）
              schema: { type: string }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGameResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/lobby:
    get:
      tags: [ゲーム]
      operationId: getLobby
      summary: ロビーを取得する（問い合わせ。lobby_* の投影）
      description: |
        認可は進行役。B1 の実装は進行役だけで、参加者には（資格の失敗と同じ）403 を返す（参加者向けのロビー＝参加コード・割り当てを含まない一覧は、読み取りの型に項目が無く、未実装。ui-design S04）。
        本文の項目は、投影の表（lobby_*）から書き出す。
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: ロビー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/participants/{participantId}/role:
    put:
      tags: [ゲーム]
      operationId: assignRole
      summary: 役割を割り当てる（AssignRole。game ストリーム）
      description: |
        認可は進行役。1 人の参加者に同時に複数の役割は持たせない（AC1.2.5）。別の役割にいる人を選んだ場合は、付け替え（D9。移動元の RoleUnassigned と移動先の RoleAssigned）として扱う。
        `DELETE` の UnassignRole（単独の解除）は B1 に含めない（bolt_1_plan 判断項目 13。未決）。

        **B5 の提案（H4。役割の入れ替え。ゲート 1 で人が決める。設計書に規則が無く、Step 3.5 で設計書にも書く）**:
        ゲームの開始後も、この操作を受け付ける。**すでに別の参加者が担当している役割へ、参加済み・未割り当ての参加者を割り当てる**ことを「入れ替え」とし、
        旧担当者の資格（復帰資格とブラウザセッション）は同じ操作で自動的に失効する。旧担当者の履歴と入力者のラベルは残す。
        開始後の、これ以外の割り当て（別の役割にいる人の付け替えなど）は、従来どおり `game.not_preparing`（409）。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/ParticipantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: 割り当てた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /participations/join:
    post:
      tags: [参加]
      operationId: joinGame
      summary: 参加コードでゲームに参加する（JoinGame。game ストリーム）
      description: |
        認可は参加コード。有効な参加コードと表示名で、ロビーに参加し、復帰資格が保存される（AC1.2.1）。
        不明・形式不正の参加コードは、区別せず同じ 403（`game.invitation_invalid`）を返す（列挙の防止。AC1.2.2）。
        **受付が終了したゲーム（開始済み）の参加は、403 ではなく 409 `game.not_preparing`** で、理由（参加の受付を終了している）を示す
        （Gherkin AC1.2.2 の 2 つ目のシナリオに従う。設計書の「区別しない」との食い違いは、bolt_1_plan の Step 8 の食い違い 5 と Step 9 の結果に記録）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameRequest"
      responses:
        "200":
          description: |
            参加した。資格（Cookie）を Set-Cookie で発行する。参加者の ID は、状態の取得（participantId）で得る。
            **B5 の追加（判断項目 7）**: 応答に、参加したゲームの ID（`gameId`）を含める（参加後の画面が、ゲームを特定できないため）。
            **B5 の提案（H3 の案 A）**: ブラウザセッション（`bg_session`。24 時間）に加え、復帰資格（`bg_recovery`。30 日）を Cookie で発行する。
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/start:
    post:
      tags: [進行]
      operationId: startGame
      summary: ゲームを開始する（startGame。game と session の 2 ストリームへ原子的に追記）
      description: |
        認可は進行役。開始が 2 つのストリームにまたがるため、ゲームの資源として `POST /games/:id/start` にする（ADR-008。beer-game2 の `POST /sessions/:id/start` からの変更）。
        4 役割のいずれかに参加者がいなければ、開始せず、不足している役割を示す（AC1.2.3。`game.start_condition_not_met`、422）。
        二重の開始は `session.already_started`（409）。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 開始した。game と session の両方の版を返す。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/StartConditionProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /sessions/{sessionId}/decisions:
    put:
      tags: [意思決定]
      operationId: saveDecision
      summary: 当週の数量を保存する（SaveDecision。session ストリーム）
      description: |
        認可は参加者（その役割の担当）。`If-Match` は意思決定の版（DecisionVersion）で、**このコマンドにだけ**付ける。
        入力する役割は、**資格から決まる**（本文に役割を持たない）。役割が無い操作者（進行役、役割が未割り当ての参加者）は、資格の失敗と同じ 403。
        流通役は発注、生産役（工場）は生産要請として保存する（AC2.2.1）。数量は 0〜1000 の整数（範囲外は 422 の quantity。
        小数・空・文字は、形の誤りとして 422 の quantity。AC2.2.2）。
        共同担当の競合は B6（`session.decision_conflict` は仕様に載せるが B1 では起きない）。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          description: 意思決定の版（DecisionVersion。整数。`"3"` のように引用符で囲んでもよい）。初回の保存は未指定（0 として扱う）。整数でなければ 422（field は If-Match）。
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDecisionRequest"
      responses:
        "200":
          description: 保存した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /sessions/{sessionId}/weeks/{week}/commit:
    post:
      tags: [進行]
      operationId: commitWeek
      summary: 1 週を確定する（CommitWeek。session ストリーム）
      description: |
        認可は進行役。`If-Match` は使わず、本文の `requestedWeek` と `basis`（役割ごとの意思決定の版）を使う。
        経路の `week` と本文の `requestedWeek` が違えば 422（field は requestedWeek）。
        判定の順は「週が違う → `session.week_advanced`」「週が同じで basis が現在の各役割の版と違う → `session.decisions_changed`」。
        入力が揃っていなければ `session.incomplete_decisions`（422。不足する役割を示す）。確定は 1 週につき一度だけ（AC2.3.2）。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: week
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 50 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitWeekRequest"
      responses:
        "200":
          description: 確定した。応答には確定の結果を含めず、versions だけを返す（結果は state で見る）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/IncompleteDecisionsProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /sessions/{sessionId}/pause:
    post:
      tags: [進行]
      operationId: pauseSession
      summary: セッションを一時停止する（PauseSession。session ストリーム。B5）
      description: |
        認可は進行役。進行中のセッションを停止する。停止中は、参加者の入力の保存（`saveDecision`）と週の確定（`commitWeek`）を、
        `session.paused`（409）で拒否し、既存の入力を失わない（AC3.1.1）。代理入力（`submitProxyDecision`）は停止中も受け付ける。
        すでに停止中なら `session.paused`（409）。開始前は `session.not_active`、終了後は `session.already_ended`（409）。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 停止した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /sessions/{sessionId}/resume:
    post:
      tags: [進行]
      operationId: resumeSession
      summary: セッションを再開する（ResumeSession。session ストリーム。B5）
      description: |
        認可は進行役。停止中のセッションを再開し、最後に確定した週から入力できる（AC3.1.3）。
        停止中でなければ `session.not_paused`（409。提案の code）。自動確定の再開時の判定は B8。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 再開した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /sessions/{sessionId}/proxy-decisions/{role}:
    put:
      tags: [意思決定]
      operationId: submitProxyDecision
      summary: 進行役が代理入力する（SubmitProxyDecision。session ストリーム。B5）
      description: |
        認可は進行役。意思決定の版は要求せず（`If-Match` を使わない）、本文の `requestedWeek` で、古い画面からの代理入力を区別する
        （現在の週と違えば `session.week_advanced`）。進行中と一時停止中の両方で受け付け、停止中は週を確定しない（AC3.1.2）。
        保存後の版は 1 増える。イベントに、入力値・操作者・時刻を残す（FR-15）。保存回数に数える（`session.save_limit_reached`。提案の code）。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: role
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Role" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyDecisionRequest"
      responses:
        "200":
          description: 代理入力を保存した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/credentials/revoke:
    post:
      tags: [資格]
      operationId: revokeCredential
      summary: 参加者の資格を失効させる（RevokeCredential。game ストリーム。B5）
      description: |
        認可は進行役。漏れた資格を失効させる（AC3.2.5）。対象の参加者の復帰資格と、発行済みのブラウザセッションを、ともに使えなくする
        （ブラウザセッションを止める結び付きの方式は、bolt_5_plan のゲート 1 の項目 2。H2）。以降、その資格での復帰・操作は、
        存在しない資格と区別しない 403（`app.unauthorized`）になり、以前に成功した `Idempotency-Key` を再送しても保存済みの応答を返さない（ADR-004）。
        すでに失効していれば `game.credential_already_revoked`（409。提案の code）。準備中と開始後の両方で受け付ける。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialSubjectRequest"
      responses:
        "200":
          description: 失効させた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/credentials/reissue:
    post:
      tags: [資格]
      operationId: reissueCredential
      summary: 参加者の資格を再発行する（ReissueCredential。game ストリーム。B5）
      description: |
        認可は進行役。新しい復帰資格を発行し、**新しい復帰コードを、この応答で一度だけ示す**（保存は鍵付きダイジェストだけ。再表示しない。
        提案: H3 の案 A）。進行役が、参加者へ口頭などで渡す。参加者は `recoverParticipation` の本文の `recoveryCode` で復帰する。
        新しい有効期限（`expiresAt`）を持つ。失効した古い資格は、使えないままである。準備中と開始後の両方で受け付ける。
        失効していない資格の再発行の扱い（拒否するか、置き換えるか）は未決（ゲート 1 の項目 6）。
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialSubjectRequest"
      responses:
        "200":
          description: 再発行した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReissueResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /participations/recover:
    post:
      tags: [参加]
      operationId: recoverParticipation
      summary: 復帰資格で、同じゲームと役割へ復帰する（RecoverParticipation。game ストリーム。B5）
      description: |
        認可は復帰資格（進行役を含む）。復帰資格は、Cookie `bg_recovery` か、本文の復帰コード（`recoveryCode`）で渡す（提案: H3 の案 A）。
        有効なら、新しいブラウザセッション（`bg_session`）を Set-Cookie で発行し、復帰資格の期限を更新する。応答にゲームの ID を含める（AC3.2.1）。
        **復帰資格の有効性が認可である**ため、失効した復帰資格での再送に、保存済みの新しいセッションを返さない（ADR-004。R5）。
        不明・失効・期限切れ・別のゲームの復帰資格は、区別しない同じ 403（`app.unauthorized`）（NF-S12。AC3.2.2）。
        参加・復帰の専用のレート制限（NF-S11）は、B5 の Step 5。
      security:
        - recoveryCookie: []
        - {}
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverRequest"
      responses:
        "200":
          description: 復帰した。新しいブラウザセッションを Set-Cookie で発行する。
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /sessions/{sessionId}/state:
    get:
      tags: [意思決定]
      operationId: getSessionState
      summary: 状態を取得する（問い合わせ。役割に応じた投影）
      description: |
        認可は役割に応じた投影。参加者には自分の役割の在庫・受注残・入荷・受注・入力だけを返し、他の役割の値と将来の需要は返さない（AC2.1.1〜AC2.1.3）。小売店には当週の需要（受注）を含める。
        進行役には全役割の入力状況と確定した週の結果を返す。確定した週の結果には役割別の値（注文、在庫、受注残、出荷、費用）を含める（AC2.3.5）。
        項目名は B1 の実装で確定した（スキーマのとおり）。`session` は準備中のゲームには無く、409 `session.not_active`。
        資格が無効・別のゲーム・存在しないゲームは、区別せず同じ 403（`app.unauthorized`）。`sessionId` はこのゲームでは `gameId` と同じ。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: role
          in: query
          required: false
          description: 他の役割の状況を取得しようとする問い合わせ（AC2.1.2）。自分の役割と違えば、値を返さず 403。役割の 4 値以外は 422（field は role）。
          schema: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: 状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /games/{gameId}/state:
    get:
      tags: [ゲーム]
      operationId: getGameState
      summary: ゲームの状態（準備中・進行中）を取得する（問い合わせ）
      description: |
        設計書のエンドポイント表に無い（要反映）。画面が、開始後に `sessionId` を得る経路として B1 で置いた。
        進行役には参加コードと最終週を、参加者には自分の `participantId` と役割を返す（呼び出した人ごとの投影）。
        `sessionId` は、このゲームでは `gameId` と同じ（開始前は null）。
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: ゲームの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /health:
    get:
      tags: [運用]
      operationId: getHealth
      summary: 生存の確認
      description: 認可なし。プロセスが生きていれば 200。
      security: []
      responses:
        "200":
          description: 生存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      tags: [運用]
      operationId: getReady
      summary: 準備の確認（SELECT 1、接続プールの取得、通知の受信の生存）
      description: 認可なし。負荷分散にはこちらを使う（AC6.1.4）。データベースに接続できない（3 秒以内に `SELECT 1` が通らない）、または通知の受信が生きていないとき 503。
      security: []
      responses:
        "200":
          description: 準備できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: |
            準備できていない。**バックエンド自身が返す 503 は必ず `type` を持つ**ため、problem+json（`type` は `/problems/app.not_ready`）で返し、
            `checks`（database、notifier の真偽）を添える（設計書は 503 の返却だけを定める。本文の形は B1 で確定）。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotReadyProblem"
security:
  - participationCookie: []
components:
  securitySchemes:
    participationCookie:
      type: apiKey
      in: cookie
      name: bg_session
      description: 資格の Cookie（HttpOnly、SameSite=Strict、HTTPS の環境では Secure）。Cookie 名 `bg_session` は B1 の仮置き（設計書に無い）。参加（join）・作成・復帰（recover）の応答で発行する。値は 256 ビットの乱数で、URL・ログ・本文に含めない。B5 の提案は、ブラウザセッション（24 時間）として、復帰資格と別のダイジェストで持つ。
    recoveryCookie:
      type: apiKey
      in: cookie
      name: bg_recovery
      description: "復帰資格の Cookie（提案: H3 の案 A。HttpOnly、SameSite=Strict、HTTPS の環境では Secure、Path は復帰の経路だけ、30 日）。参加・作成の応答で発行し、復帰（recover）でだけ使う。値は 256 ビットの乱数で、URL・ログ・本文に含めない。"
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 未決：session ストリームの ID が gameId と同じか別かは、設計書のエンドポイント表から確定できない。
      schema: { type: string, format: uuid }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 変更系は必須。同じキーで本文が違う要求は `app.idempotency_key_reused`（409）。
      schema: { type: string }
  headers:
    CorrelationId:
      description: すべての応答に付ける相関 ID（要求の `x-correlation-id` が UUID ならそれを使い、そうでなければ作る）
      schema: { type: string }
    SetCookie:
      description: 資格の Cookie（`bg_session=<値>; Path=/; HttpOnly; SameSite=Strict; Max-Age=<秒>`。HTTPS の環境では `Secure`）。
      schema: { type: string }
  responses:
    Problem:
      description: problem+json。`type` は `/problems/{code}`、拡張メンバー `code` に同じ値を持つ。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        Retry-After:
          description: "app.retry_exhausted（503。1 秒）と app.rate_limited（429。窓の残り秒数）のときだけ付ける。"
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: 入力検証の誤り。項目ごとの誤りを、すべて集めて配列で返す（AC1.1.2、AC2.2.2）。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemBody"
    ConflictProblem:
      description: 入力の競合・確定の根拠の変化・週の進行（409）。code に応じた詳細を、拡張メンバーで添える（`session.week_advanced`、`session.decision_conflict`、`session.decisions_changed`）。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        Retry-After:
          description: "app.retry_exhausted（503。1 秒）と app.rate_limited（429。窓の残り秒数）のときだけ付ける。"
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ConflictProblemBody"
    StartConditionProblem:
      description: 開始条件の不足（`game.start_condition_not_met`）または二重の開始（409 `session.already_started`）など。不足する役割を示す。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/StartConditionProblemBody"
    IncompleteDecisionsProblem:
      description: 入力が揃わない週の確定（`session.incomplete_decisions`）。不足する役割を示す。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IncompleteDecisionsProblemBody"
  schemas:
    Role:
      type: string
      description: 上流から下流の順（ドメインモデル）。画面の表示名（工場、一次卸、二次卸、小売店）は辞書が持つ。
      enum: [FACTORY, DISTRIBUTOR, WHOLESALER, RETAILER]
    ErrorCode:
      type: string
      description: |
        problem+json の code（小文字のドット区切り `<領域>.<名前>`）の B1 の範囲の一覧。
        出典は ui-design.md「エラーの code と表示の辞書」と architecture-backend.md「入力の検証とエラーの写像」。
        業務の code は、ドメインの `DomainError.code`（実装が正本。ドメインモデルに code の一覧表は無く、例として 4 つが載るだけ）。
        `validation.invalid_input`（入力検証の 422・構文エラーの 400 の code）と、HTTP の層の code（`app.not_ready`、`app.rate_limited`、
        `request.*`）は、設計書が名前を定めていないため、B1 の仮置き（**未決**。UI の辞書への追加が要る）。
        権限の不足（業務の Forbidden）は、すべて `app.unauthorized`（資格の失敗と同じ本文。業務の理由を返さない）。
      enum:
        - session.decision_conflict
        - session.week_advanced
        - session.decisions_changed
        - session.already_started
        - session.already_ended
        - session.not_active
        - session.paused
        - session.not_paused
        - session.save_limit_reached
        - session.incomplete_decisions
        - game.invitation_invalid
        - game.not_preparing
        - game.already_created
        - game.participant_not_found
        - game.start_condition_not_met
        - game.credential_already_revoked
        - validation.invalid_input
        - app.retry_exhausted
        - app.idempotency_key_reused
        - app.unauthorized
        - app.internal
        - app.not_ready
        - app.rate_limited
        - request.too_large
        - request.not_found
        - request.method_not_allowed
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          description: "`/problems/{code}`（相対 URI）"
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        correlationId: { type: string }
    ValidationProblemBody:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              description: 項目ごとの誤り（誤りはすべて集める）。項目の形は未決（設計書は配列で返すことだけを定める）。AC1.1.2 は、需要系列の誤りに対象週と修正内容を含める。
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  week:
                    type: integer
                    description: 需要系列の誤りの対象週
                  message:
                    type: string
                    description: 修正内容
    DecisionEntry:
      type: object
      description: 役割ごとの、保存済みの入力（数量と版）。
      required: [quantity, version]
      properties:
        quantity: { type: integer }
        version: { type: integer, minimum: 0 }
    ConflictProblemBody:
      description: 409 の拡張メンバー。どれが付くかは code による。
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            requestedWeek:
              type: integer
              description: "`session.week_advanced`: 要求した週"
            currentWeek:
              type: integer
              description: "`session.week_advanced`: 現在の週"
            role:
              description: "`session.decision_conflict`: 競合した役割"
              $ref: "#/components/schemas/Role"
            latest:
              description: "`session.decision_conflict`: 最新の入力（無ければ項目ごと付けない）"
              $ref: "#/components/schemas/DecisionEntry"
            week:
              type: integer
              description: "`session.decisions_changed`: 確定の対象の週"
            current:
              type: object
              description: "`session.decisions_changed`: 現在の、役割ごとの入力"
              additionalProperties: { $ref: "#/components/schemas/DecisionEntry" }
    NotReadyProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [checks]
          properties:
            checks:
              type: object
              required: [database, notifier]
              properties:
                database: { type: boolean }
                notifier: { type: boolean }
    StartConditionProblemBody:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            missingRoles:
              type: array
              items: { $ref: "#/components/schemas/Role" }
    IncompleteDecisionsProblemBody:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            missingRoles:
              type: array
              items: { $ref: "#/components/schemas/Role" }
    StreamVersions:
      type: object
      description: "追記後のストリームごとの版。そのコマンドが追記しなかったストリームは null（例: 作成は session が null、入力の保存は game が null）。"
      required: [game, session]
      properties:
        game:
          type: [integer, "null"]
          minimum: 0
        session:
          type: [integer, "null"]
          minimum: 0
          description: session ストリームが未作成（開始前）、またはそのコマンドが追記しなかったときは null。
    CommandResponse:
      type: object
      description: コマンドの応答は versions だけ。画面の表示は応答から作らず、スナップショットを取得して versions に追いつくまで待つ。
      required: [versions]
      properties:
        versions: { $ref: "#/components/schemas/StreamVersions" }
    CreateGameResponse:
      description: |
        作成の応答。`versions` に加え、**進行役の復帰コード**を一度だけ示す（B5 の提案。判断項目 9 の案 A。H3）。
        案 B（Cookie の寿命だけに頼る）を採るときは、`recoveryCode` を外し、`CommandResponse` に戻す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [recoveryCode]
          properties:
            recoveryCode:
              type: string
              description: 進行役の復帰コード。作成のときに一度だけ示す。保存はダイジェストだけで、再表示しない。ログ・URL に含めない。
    JoinResponse:
      description: 参加の応答。`versions` に加え、参加したゲームの ID（`gameId`。B5 の判断項目 7）を返す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [gameId]
          properties:
            gameId: { type: string, format: uuid }
    RecoverResponse:
      description: 復帰の応答。復帰したゲームの ID と、復帰した操作者の種別（進行役か参加者）を返す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [gameId, kind]
          properties:
            gameId: { type: string, format: uuid }
            kind:
              type: string
              enum: [FACILITATOR, PARTICIPANT]
            role:
              description: 参加者のとき、担当の役割（未割り当てなら項目ごと付けない）。
              $ref: "#/components/schemas/Role"
    ReissueResponse:
      description: "再発行の応答。新しい復帰コードを、この応答で一度だけ示す（提案: H3 の案 A）。"
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [recoveryCode, expiresAt]
          properties:
            recoveryCode:
              type: string
              description: 新しい復帰コード。一度だけ示す。保存はダイジェストだけで、再表示しない。ログ・URL に含めない。
            expiresAt:
              type: string
              format: date-time
              description: 新しい復帰資格の有効期限。
    ProxyDecisionRequest:
      type: object
      required: [requestedWeek, quantity]
      properties:
        requestedWeek:
          type: integer
          minimum: 1
          maximum: 50
          description: 画面が表示している週。現在の週と違えば `session.week_advanced`（409）。
        quantity:
          type: integer
          minimum: 0
          maximum: 1000
    CredentialSubjectRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: object
          description: 失効・再発行の対象。B5 は参加者だけ（進行役自身の資格は、ゲート 1 の項目 6 で決める。観察者は B9）。
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [PARTICIPANT]
            id:
              type: string
              format: uuid
              description: 参加者の ID。
    RecoverRequest:
      type: object
      required: [gameId]
      properties:
        gameId: { type: string, format: uuid }
        recoveryCode:
          type: string
          description: 復帰コード（再発行の応答、または作成の応答で示したもの）。省略すると、Cookie `bg_recovery` の復帰資格を使う。
    CreateGameRequest:
      type: object
      description: |
        キット準拠の作成（B1）。カスタム条件（B7）は含めない。
        **最終週と需要系列は必須**（キットの既定の系列は ASM-01 のとおり JSD の値が未確定のため、B1 では既定を置かない。custom series で技術検証できるが、JSD 準拠の受入判定は保留）。
        範囲（週 1〜50、需要 0〜1000、保持日数 1〜3650）の検証は domain が持つ。範囲外は 422 で、需要の誤りは対象の週（1 始まり）と修正内容を示す。
        整数でない値（小数・文字・null）は、形の誤りとして 422（需要は対象の週つき）。JSON として不正な本文は 400。
      required: [kind, finalWeek, demand]
      properties:
        kind:
          type: string
          enum: [KIT]
        finalWeek:
          type: integer
          minimum: 1
          maximum: 50
          description: 最終週（AC1.1.5。1〜50）。
        demand:
          type: array
          description: 需要系列（最終週以上の長さ、各 0〜1000）。長さの下限は最終週に依存するので、スキーマでは表さない（domain が検証する）。
          items: { type: integer, minimum: 0, maximum: 1000 }
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: 保持日数（1〜3650）。未指定は 90（NF-S16）。
    JoinGameRequest:
      type: object
      required: [joinCode, displayName]
      properties:
        joinCode: { type: string }
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: 表示名。前後の空白を除いて 1〜80 文字（コードポイントの数。domain の `DisplayName`。空白だけの表示名は domain が拒否する）。
    AssignRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    SaveDecisionRequest:
      type: object
      required: [week, quantity]
      properties:
        week:
          type: integer
          minimum: 1
          maximum: 50
          description: 保存する週（`requestedWeek` と同様の扱いか未決。設計書は SaveDecision の本文を定めていない）。
        quantity:
          type: integer
          minimum: 0
          maximum: 1000
    CommitWeekRequest:
      type: object
      required: [requestedWeek, basis]
      properties:
        requestedWeek:
          type: integer
          minimum: 1
          maximum: 50
        basis:
          type: object
          description: 確認の時点で見ていた、役割ごとの意思決定の版。
          required: [FACTORY, DISTRIBUTOR, WHOLESALER, RETAILER]
          properties:
            FACTORY: { type: integer, minimum: 0 }
            DISTRIBUTOR: { type: integer, minimum: 0 }
            WHOLESALER: { type: integer, minimum: 0 }
            RETAILER: { type: integer, minimum: 0 }
    LobbyParticipant:
      type: object
      required: [participantId, displayName, role]
      properties:
        participantId: { type: string, format: uuid }
        displayName:
          type: [string, "null"]
          description: 表示名（周辺ストアの値。投影に無ければ null）。
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
    Lobby:
      type: object
      description: ロビーの投影（lobby_*）から書き出した、進行役向けの一覧。
      required: [gameId, status, joinCode, participants, versions]
      properties:
        gameId: { type: string, format: uuid }
        status:
          type: string
          enum: [PREPARING, STARTED, ENDED]
        joinCode:
          type: string
          description: 進行役にだけ返す。
        participants:
          type: array
          items: { $ref: "#/components/schemas/LobbyParticipant" }
        versions: { $ref: "#/components/schemas/StreamVersions" }
    GameState:
      type: object
      description: 呼び出した人ごとの投影。進行役は `joinCode`・`finalWeek`、参加者は `participantId`・`role` を受け取る。
      required: [gameId, sessionId, status, versions]
      properties:
        gameId: { type: string, format: uuid }
        sessionId:
          type:
            - string
            - "null"
          format: uuid
          description: このゲームでは gameId と同じ。開始前（PREPARING）は null。
        status:
          type: string
          enum: [PREPARING, STARTED, ENDED]
        joinCode:
          type: string
          description: 進行役だけ。
        finalWeek:
          type: integer
          description: 進行役だけ。
        participantId:
          type: string
          format: uuid
          description: 参加者だけ（自分の ID）。
        role:
          $ref: "#/components/schemas/Role"
        versions: { $ref: "#/components/schemas/StreamVersions" }
    RoleStatus:
      type: object
      description: 役割別の状況（B1 で確定した項目名）。
      required: [inventory, backlog, arrivals, orders, decision, decisionVersion]
      properties:
        inventory: { type: integer }
        backlog: { type: integer }
        arrivals: { type: integer, description: 当週に処理する入荷 }
        orders: { type: integer, description: 当週の受注 }
        customerDemand:
          type: integer
          description: 小売店だけに含める、当週の顧客需要（AC2.1.3。他の役割には項目ごと含めない。将来の週の需要はどの応答にも含めない）。
        decision:
          type:
            - integer
            - "null"
          description: 当週の入力値（未入力は null）
        decisionVersion: { type: integer, minimum: 0 }
    RoleWeekResult:
      type: object
      description: 確定した週の、役割別の結果。AC2.3.5 の例示（注文、在庫、受注残、出荷、費用）。費用は最小単位（セント）の整数。
      required: [role, week, orders, order, inventory, backlog, shipment, cost, cumulativeCost]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        week: { type: integer }
        orders: { type: integer, description: その週に受けた注文 }
        order: { type: integer, description: その週に発注（工場は生産要請）した数量 }
        inventory: { type: integer, description: 週末の在庫 }
        backlog: { type: integer, description: 週末の受注残 }
        shipment: { type: integer, description: その週の出荷 }
        cost: { type: integer, description: その週の費用（最小単位） }
        cumulativeCost: { type: integer, description: 累計の費用（最小単位） }
    SessionState:
      type: object
      description: 呼び出した人の役割に応じた投影。参加者は自分の役割の `roleStatus` だけを受け取る。進行役は `roles` と `results` を受け取る。
      required: [sessionId, status, week, submittedRoleCount, versions]
      properties:
        sessionId: { type: string, format: uuid, description: このゲームでは gameId と同じ }
        status:
          type: string
          enum: [ACTIVE, PAUSED, ENDED]
        week:
          type: integer
          description: 現在の週（第 1 週から）。最終週の確定後は終了。
        submittedRoleCount:
          type: integer
          description: 当週の入力が済んだ役割の数（チーム全体の集計値）。
        participantId:
          type: string
          format: uuid
          description: 参加者だけ（自分の ID）。
        role:
          $ref: "#/components/schemas/Role"
        finalWeek:
          type: integer
          description: 進行役だけ。
        roleStatus: { $ref: "#/components/schemas/RoleStatus" }
        roles:
          type: object
          description: 進行役だけ。役割ごとの状況。
          additionalProperties: { $ref: "#/components/schemas/RoleStatus" }
        results:
          type: array
          description: 進行役だけ。確定した週の、役割別の結果。
          items: { $ref: "#/components/schemas/RoleWeekResult" }
        versions: { $ref: "#/components/schemas/StreamVersions" }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
