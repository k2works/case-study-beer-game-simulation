        設計書のエンドポイント表に無い（要反映）。画面が、開始後に `sessionId` を得る経路として B1 で置いた。
        進行役には参加コードと最終週を、参加者には自分の `participantId` と役割を返す（呼び出した人ごとの投影）。
        `sessionId` は、このゲームでは `gameId` と同じ（開始前は null）。
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: ゲームの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /health:
    get:
      tags: [運用]
      operationId: getHealth
      summary: 生存の確認
      description: 認可なし。プロセスが生きていれば 200。
      security: []
      responses:
        "200":
          description: 生存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      tags: [運用]
      operationId: getReady
      summary: 準備の確認（SELECT 1、接続プールの取得、通知の受信の生存）
      description: 認可なし。負荷分散にはこちらを使う（AC6.1.4）。データベースに接続できない（3 秒以内に `SELECT 1` が通らない）、または通知の受信が生きていないとき 503。
      security: []
      responses:
        "200":
          description: 準備できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: |
            準備できていない。**バックエンド自身が返す 503 は必ず `type` を持つ**ため、problem+json（`type` は `/problems/app.not_ready`）で返し、
            `checks`（database、notifier の真偽）を添える（設計書は 503 の返却だけを定める。本文の形は B1 で確定）。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotReadyProblem"
security:
  - participationCookie: []
components:
  securitySchemes:
    participationCookie:
      type: apiKey
      in: cookie
      name: bg_session
      description: 資格の Cookie（HttpOnly、SameSite=Strict、HTTPS の環境では Secure）。Cookie 名 `bg_session` は B1 の仮置き（設計書に無い）。参加（join）・作成・復帰（recover）の応答で発行する。値は 256 ビットの乱数で、URL・ログ・本文に含めない。B5 の提案は、ブラウザセッション（24 時間）として、復帰資格と別のダイジェストで持つ。リクエストヘッダー `X-Tab-Id`（英数字 16〜64 文字。画面がタブごとに作る。秘密ではない）があれば、Cookie の名前は `bg_session_<X-Tab-Id>` になる（発行も読み取りも。ADR-020）。ヘッダーが無い・形が不正なら `bg_session`。
    recoveryCookie:
      type: apiKey
      in: cookie
      name: bg_recovery
      description: "復帰資格の Cookie（提案: H3 の案 A。HttpOnly、SameSite=Strict、HTTPS の環境では Secure、Path は復帰の経路だけ、30 日）。参加・作成の応答で発行し、復帰（recover）でだけ使う。値は 256 ビットの乱数で、URL・ログ・本文に含めない。`X-Tab-Id` があれば、名前は `bg_recovery_<X-Tab-Id>` になる（ADR-020）。"
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 未決：session ストリームの ID が gameId と同じか別かは、設計書のエンドポイント表から確定できない。
      schema: { type: string, format: uuid }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 変更系は必須。同じキーで本文が違う要求は `app.idempotency_key_reused`（409）。
      schema: { type: string }
  headers:
    CorrelationId:
      description: すべての応答に付ける相関 ID（要求の `x-correlation-id` が UUID ならそれを使い、そうでなければ作る）
      schema: { type: string }
    SetCookie:
      description: |
        資格の Cookie。ブラウザセッションは `bg_session=<値>; Path=/; HttpOnly; SameSite=Strict; Max-Age=<秒>`（`Max-Age` は、サーバー側の
        ブラウザセッションの有効期限と同じ。既定 86400 秒）。作成・参加の応答は、復帰資格の `bg_recovery=<値>; Path=/api/v1/participations/recover;
        HttpOnly; SameSite=Strict; Max-Age=<秒>`（既定 2592000 秒）も付ける。HTTPS の環境では `Secure`。
      schema: { type: string }
  responses:
    Problem:
      description: problem+json。`type` は `/problems/{code}`、拡張メンバー `code` に同じ値を持つ。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        Retry-After:
          description: "app.retry_exhausted（503。1 秒）と app.rate_limited（429。窓の残り秒数）のときだけ付ける。"
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: 入力検証の誤り。項目ごとの誤りを、すべて集めて配列で返す（AC1.1.2、AC2.2.2）。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemBody"
    ConflictProblem:
      description: 入力の競合・確定の根拠の変化・週の進行（409）。code に応じた詳細を、拡張メンバーで添える（`session.week_advanced`、`session.decision_conflict`、`session.decisions_changed`）。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        Retry-After:
          description: "app.retry_exhausted（503。1 秒）と app.rate_limited（429。窓の残り秒数）のときだけ付ける。"
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ConflictProblemBody"
    StartConditionProblem:
      description: 開始条件の不足（`game.start_condition_not_met`）または二重の開始（409 `session.already_started`）など。不足する役割を示す。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/StartConditionProblemBody"
    IncompleteDecisionsProblem:
      description: 入力が揃わない週の確定（`session.incomplete_decisions`）。不足する役割を示す。
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IncompleteDecisionsProblemBody"
  schemas:
    Role:
      type: string
      description: 上流から下流の順（ドメインモデル）。画面の表示名（工場、一次卸、二次卸、小売店）は辞書が持つ。
      enum: [FACTORY, DISTRIBUTOR, WHOLESALER, RETAILER]
    ErrorCode:
      type: string
      description: |
        problem+json の code（小文字のドット区切り `<領域>.<名前>`）の B1 の範囲の一覧。
        出典は ui-design.md「エラーの code と表示の辞書」と architecture-backend.md「入力の検証とエラーの写像」。
        業務の code は、ドメインの `DomainError.code`（実装が正本。ドメインモデルに code の一覧表は無く、例として 4 つが載るだけ）。
        `validation.invalid_input`（入力検証の 422・構文エラーの 400 の code）と、HTTP の層の code（`app.not_ready`、`app.rate_limited`、
        `request.*`）は、設計書が名前を定めていないため、B1 の仮置き（**未決**。UI の辞書への追加が要る）。
        権限の不足（業務の Forbidden）は、すべて `app.unauthorized`（資格の失敗と同じ本文。業務の理由を返さない）。
      enum:
        - session.decision_conflict
        - session.week_advanced
        - session.decisions_changed
        - session.already_started
        - session.already_ended
        - session.not_active
        - session.paused
        - session.not_paused
        - session.save_limit_reached
        - session.incomplete_decisions
        - game.invitation_invalid
        - game.not_preparing
        - game.already_created
        - game.participant_not_found
        - game.start_condition_not_met
        - game.credential_already_revoked
        - game.credential_not_revoked
        - game.not_ended
        - game.invitation_not_found
        - validation.invalid_input
        - app.retry_exhausted
        - app.idempotency_key_reused
        - app.unauthorized
        - app.internal
        - app.not_ready
        - app.rate_limited
        - request.too_large
        - request.not_found
        - request.method_not_allowed
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          description: "`/problems/{code}`（相対 URI）"
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        correlationId: { type: string }
    ValidationProblemBody:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              description: 項目ごとの誤り（誤りはすべて集める）。項目の形は未決（設計書は配列で返すことだけを定める）。AC1.1.2 は、需要系列の誤りに対象週と修正内容を含める。
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  week:
                    type: integer
                    description: 需要系列の誤りの対象週
                  message:
                    type: string
                    description: 修正内容
    DecisionEditor:
      type: object
      description: |
        入力を保存した人（B6 の提案）。参加者か、進行役の代理入力。**表示名は、同じ役割の共同担当と進行役にだけ**示す
        （他の役割の参加者・観察者・無資格には、そもそもこの値を返さない）。進行役の代理入力は、表示名を持たない（画面が「進行役（代理入力）」と示す）。
      required: [kind, isSelf]
      properties:
        kind:
          type: string
          enum: [PARTICIPANT, FACILITATOR_PROXY]
        displayName:
          type: [string, "null"]
          description: 参加者の表示名（`kind` が `PARTICIPANT` のときだけ。周辺ストアの値。無ければ null）。
        isSelf:
          type: boolean
          description: 呼び出した人自身が保存したか（参加者は自分の参加者、進行役は代理入力のとき true）。画面が「あなたが 10:42 に保存」と示すのに使う。
    DecisionEntry:
      type: object
      description: 役割ごとの、保存済みの入力（数量・版・最後の保存者・保存の時刻）。
      required: [quantity, version, editor, savedAt]
      properties:
        quantity: { type: integer }
        version: { type: integer, minimum: 0 }
        editor: { $ref: "#/components/schemas/DecisionEditor" }
        savedAt:
          type: string
          format: date-time
          description: 保存の時刻（投影 `current_decisions.updated_at`。イベントには時刻を足さない。判断項目 7）。
    CoHolder:
      type: object
      description: 同じ役割の共同担当（B6 の提案）。表示名は、同じ役割の参加者にだけ示す。参加者の ID は含めない。
      required: [displayName, isSelf]
      properties:
        displayName:
          type: [string, "null"]
        isSelf: { type: boolean }
    ConflictProblemBody:
      description: 409 の拡張メンバー。どれが付くかは code による。
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            requestedWeek:
              type: integer
              description: "`session.week_advanced`: 要求した週"
            currentWeek:
              type: integer
              description: "`session.week_advanced`: 現在の週"
            role:
              description: "`session.decision_conflict`: 競合した役割"
              $ref: "#/components/schemas/Role"
            latest:
              description: "`session.decision_conflict`: 最新の入力（数量・版・最後の保存者・保存の時刻。競合した人自身の入力は含めない。無ければ項目ごと付けない）"
              $ref: "#/components/schemas/DecisionEntry"
            week:
              type: integer
              description: "`session.decisions_changed`: 確定の対象の週"
            current:
              type: object
              description: "`session.decisions_changed`: 現在の、役割ごとの入力"
              additionalProperties: { $ref: "#/components/schemas/DecisionEntry" }
    NotReadyProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [checks]
          properties:
            checks:
              type: object
              required: [database, notifier]
              properties:
                database: { type: boolean }
                notifier: { type: boolean }
    StartConditionProblemBody:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            missingRoles:
              type: array
              items: { $ref: "#/components/schemas/Role" }
    IncompleteDecisionsProblemBody:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            missingRoles:
              type: array
              items: { $ref: "#/components/schemas/Role" }
    StreamVersions:
      type: object
      description: "追記後のストリームごとの版。そのコマンドが追記しなかったストリームは null（例: 作成は session が null、入力の保存は game が null）。"
      required: [game, session]
      properties:
        game:
          type: [integer, "null"]
          minimum: 0
        session:
          type: [integer, "null"]
          minimum: 0
          description: session ストリームが未作成（開始前）、またはそのコマンドが追記しなかったときは null。
    CommandResponse:
      type: object
      description: コマンドの応答は versions だけ。画面の表示は応答から作らず、スナップショットを取得して versions に追いつくまで待つ。
      required: [versions]
      properties:
        versions: { $ref: "#/components/schemas/StreamVersions" }
    CreateGameResponse:
      description: |
        作成の応答。`versions` に加え、**進行役の復帰コード**を一度だけ示す（B5 の提案。判断項目 9 の案 A。H3）。
        案 B（Cookie の寿命だけに頼る）を採るときは、`recoveryCode` を外し、`CommandResponse` に戻す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [recoveryCode]
          properties:
            recoveryCode:
              type: string
              description: 進行役の復帰コード。作成のときに一度だけ示す。保存はダイジェストだけで、再表示しない。ログ・URL に含めない。
    JoinResponse:
      description: 参加の応答。`versions` に加え、参加したゲームの ID（`gameId`。B5 の判断項目 7）を返す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [gameId]
          properties:
            gameId: { type: string, format: uuid }
    RecoverResponse:
      description: 復帰の応答。復帰したゲームの ID と、復帰した操作者の種別（進行役か参加者）を返す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [gameId, kind]
          properties:
            gameId: { type: string, format: uuid }
            kind:
              type: string
              enum: [FACILITATOR, PARTICIPANT]
            role:
              description: 参加者のとき、担当の役割（未割り当てなら項目ごと付けない）。
              $ref: "#/components/schemas/Role"
    ReissueResponse:
      description: "再発行の応答。新しい復帰コードを、この応答で一度だけ示す（提案: H3 の案 A）。"
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [recoveryCode, expiresAt]
          properties:
            recoveryCode:
              type: string
              description: 新しい復帰コード。一度だけ示す。保存はダイジェストだけで、再表示しない。ログ・URL に含めない。
            expiresAt:
              type: string
              format: date-time
              description: 新しい復帰資格の有効期限。
    ProxyDecisionRequest:
      type: object
      required: [requestedWeek, quantity]
      properties:
        requestedWeek:
          type: integer
          minimum: 1
          maximum: 50
          description: 画面が表示している週。現在の週と違えば `session.week_advanced`（409）。
        quantity:
          type: integer
          minimum: 0
          maximum: 1000
    CredentialSubjectRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: object
          description: 失効・再発行の対象。B5 は参加者だけ（進行役自身の資格は、ゲート 1 の項目 6 で決める。観察者は B9）。
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [PARTICIPANT]
            id:
              type: string
              format: uuid
              description: 参加者の ID。
    RecoverRequest:
      type: object
      required: [gameId]
      properties:
        gameId: { type: string, format: uuid }
        recoveryCode:
          type: string
          description: 復帰コード（再発行の応答、または作成の応答で示したもの）。省略すると、Cookie `bg_recovery` の復帰資格を使う。
    CreateGameRequest:
      type: object
      description: |
        ゲームの作成。種別 `KIT`（キット準拠）か `CUSTOM`（カスタム条件。B7 の提案）。
        **最終週と需要系列は必須**（キットの既定の系列は ASM-01 のとおり JSD の値が未確定のため、既定を置かない。custom series で技術検証できるが、JSD 準拠の受入判定は保留）。
        範囲（週 1〜50、需要 0〜1000、保持日数 1〜3650）の検証は domain が持つ。範囲外は 422 で、需要の誤りは対象の週（1 始まり）と修正内容を示す。
        整数でない値（小数・文字・null）は、形の誤りとして 422（需要は対象の週つき）。JSON として不正な本文は 400。
        **カスタム条件（B7）**: `conditions`（任意）で、初期在庫・遅延・費用単価・公開範囲を変える。省略した項目は、キットの値。
        `KIT` に `conditions` を付けると 422（`conditions`。カスタムで作成するよう示す）。範囲外の値は 422 で、対象（`conditions.<項目>`）と修正内容を、すべて集めて示す。
        **設定の種別は、値から導出**する（キットの値と同じなら、`CUSTOM` で送っても `KIT`）。結果は、状態の `settingsKind`・`changedSettings` に示す（AC1.1.3）。
      required: [kind, finalWeek, demand]
      properties:
        kind:
          type: string
          enum: [KIT, CUSTOM]
        conditions: { $ref: "#/components/schemas/CustomConditions" }
        commitMode:
          allOf:
            - $ref: "#/components/schemas/CommitMode"
          description: 確定方式（AC1.1.6。B8）。省略は `MANUAL`（自動確定は無効）。設定の種別（`settingsKind`）の判定には含めない。
        finalWeek:
          type: integer
          minimum: 1
          maximum: 50
          description: 最終週（AC1.1.5。1〜50）。
        demand:
          type: array
          description: 需要系列（最終週以上の長さ、各 0〜1000）。長さの下限は最終週に依存するので、スキーマでは表さない（domain が検証する）。
          items: { type: integer, minimum: 0, maximum: 1000 }
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: 保持日数（1〜3650）。未指定は 90（NF-S16）。
    CustomConditions:
      type: object
      description: |
        カスタム条件（B7 の提案。範囲は仮置きで、人が決める）。省略した項目は、キットの値（初期在庫 12、初期の流れ 4、遅延 2 週、在庫単価 50・受注残単価 100（最小単位）、公開範囲 `TEAM_TOTAL`）。
        公開範囲の実際の開示（観察者への表示・抑止）は B9。ここでは、設定として保存するだけ。
      properties:
        initialInventory:
          type: object
          description: 役割ごとの初期在庫（0〜1000）。省略した役割は 12。
          additionalProperties: { type: integer, minimum: 0, maximum: 1000 }
        initialFlow:
          type: integer
          minimum: 0
          maximum: 1000
          description: 初期の流れ（遅延の各段にある注文・品物の数量。0〜1000）。キットは 4。
        orderDelayWeeks: { type: integer, minimum: 1, maximum: 8, description: 注文の遅延（週。1〜8）。キットは 2。 }
        shipmentDelayWeeks: { type: integer, minimum: 1, maximum: 8, description: 配送の遅延（週。1〜8）。キットは 2。 }
        productionDelayWeeks: { type: integer, minimum: 1, maximum: 8, description: 工場の生産の遅延（週。1〜8）。キットは 2。 }
        holdingCostMinor: { type: integer, minimum: 0, maximum: 100000, description: 在庫の単価（1 単位・1 週。最小単位）。キットは 50。 }
        backlogCostMinor: { type: integer, minimum: 0, maximum: 100000, description: 受注残の単価（1 単位・1 週。最小単位）。キットは 100。 }
        disclosurePolicy:
          type: string
          enum: [TEAM_TOTAL, NONE]
          description: プレイ中に観察者へ見せる範囲。キットは `TEAM_TOTAL`。
    CommitMode:
      type: string
      enum: [MANUAL, AUTO]
      description: 確定方式。`MANUAL`（進行役が確定する）、`AUTO`（4 役割の入力がそろったら、同じ追記で自動的に確定する）。
    SetCommitModeRequest:
      type: object
      required: [commitMode]
      properties:
        commitMode: { $ref: "#/components/schemas/CommitMode" }
    SettingsKind:
      type: string
      enum: [KIT, CUSTOM]
      description: 設定の種別。キットの値と同じなら `KIT`、違えば `CUSTOM`（最終週と需要系列は、ASM-01 が確定するまで判定に含めない）。
    SettingsField:
      type: string
      enum:
        [INITIAL_INVENTORY, INITIAL_FLOW, ORDER_DELAY, SHIPMENT_DELAY, PRODUCTION_DELAY, HOLDING_COST, BACKLOG_COST, DISCLOSURE]
      description: キットの値から変えた項目。
    JoinGameRequest:
      type: object
      required: [joinCode, displayName]
      properties:
        joinCode: { type: string }
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: 表示名。前後の空白を除いて 1〜80 文字（コードポイントの数。domain の `DisplayName`。空白だけの表示名は domain が拒否する）。
    AssignRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    SaveDecisionRequest:
      type: object
      required: [week, quantity]
      properties:
        week:
          type: integer
          minimum: 1
          maximum: 50
          description: 保存する週（`requestedWeek` と同様の扱いか未決。設計書は SaveDecision の本文を定めていない）。
        quantity:
          type: integer
          minimum: 0
          maximum: 1000
    CommitWeekRequest:
      type: object
      required: [requestedWeek, basis]
      properties:
        requestedWeek:
          type: integer
          minimum: 1
          maximum: 50
        basis:
          type: object
          description: 確認の時点で見ていた、役割ごとの意思決定の版。
          required: [FACTORY, DISTRIBUTOR, WHOLESALER, RETAILER]
          properties:
            FACTORY: { type: integer, minimum: 0 }
            DISTRIBUTOR: { type: integer, minimum: 0 }
            WHOLESALER: { type: integer, minimum: 0 }
            RETAILER: { type: integer, minimum: 0 }
    LobbyParticipant:
      type: object
      required: [participantId, displayName, role]
      properties:
        participantId: { type: string, format: uuid }
        displayName:
          type: [string, "null"]
          description: 表示名（周辺ストアの値。投影に無ければ null）。
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        replaced:
          type: boolean
          description: |
            役割の入れ替えで外された旧担当者なら true（入れ替え以外では省略 = false。`lobby_participants.replaced_at`。マイグレーション 007。
            ゲート 5 で承認済み）。履歴と入力者のラベルのために行は残る。
    Lobby:
      type: object
      description: ロビーの投影（lobby_*）から書き出した、進行役向けの一覧。
      required: [gameId, status, joinCode, settingsKind, changedSettings, commitMode, participants, invitations, observers, versions]
      properties:
        gameId: { type: string, format: uuid }
        status:
          type: string
          enum: [PREPARING, STARTED, ENDED]
        joinCode:
          type: string
          description: 進行役にだけ返す。
        settingsKind: { $ref: "#/components/schemas/SettingsKind" }
        changedSettings:
          type: array
          description: キットの値から変えた項目（`settingsKind` が `KIT` なら空）。
          items: { $ref: "#/components/schemas/SettingsField" }
        commitMode: { $ref: "#/components/schemas/CommitMode" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/LobbyParticipant" }
        invitations:
          type: array
          description: 観察用の招待（B9）。招待コードの値は含まない（発行の応答だけが運ぶ）。
          items: { $ref: "#/components/schemas/LobbyInvitation" }
        observers:
          type: array
          description: 参加した観察者（B9）。役割を持たない。
          items: { $ref: "#/components/schemas/LobbyObserver" }
        versions: { $ref: "#/components/schemas/StreamVersions" }
    LobbyInvitation:
      type: object
      required: [invitationId, expiresAt, revoked, createdAt]
      properties:
        invitationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        revoked:
          type: boolean
          description: 失効させたら true。失効していなくて `expiresAt` を過ぎていれば、期限切れ（画面が現在時刻と比べる）。
        createdAt: { type: string, format: date-time }
    LobbyObserver:
      type: object
      required: [observerId, displayName, joinedAt]
      properties:
        observerId: { type: string, format: uuid }
        displayName:
          type: [string, "null"]
          description: 表示名（周辺ストアの値）。観察者は役割を持たないので、`role` の項目は無い。
        joinedAt: { type: string, format: date-time }
    InviteObserverResponse:
      description: 招待の発行の応答。招待コードと招待の ID・有効期限を、一度だけ示す（再表示しない）。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [invitationId, invitationCode, expiresAt]
          properties:
            invitationId: { type: string, format: uuid }
            invitationCode:
              type: string
              description: 観察用の招待コード。参加コードとは別の値。一度だけ示す。保存はダイジェストだけで、再表示しない。ログ・URL に含めない。
            expiresAt: { type: string, format: date-time }
    JoinObserverRequest:
      type: object
      required: [invitationCode, displayName]
      properties:
        invitationCode: { type: string }
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: 表示名。前後の空白を除いて 1〜80 文字（domain の `DisplayName`）。
    JoinObserverResponse:
      description: 観察者の参加の応答。参加したゲームの ID と、種別（`OBSERVER`）を返す。
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [gameId, kind]
          properties:
            gameId: { type: string, format: uuid }
            kind:
              type: string
              enum: [OBSERVER]
    ObservationWeek:
      type: object
      description: 確定した 1 週のチーム合計。寄与者が 2 未満の週は、値を持たず `hidden` と理由だけ。
      required: [week]
      properties:
        week: { type: integer, minimum: 1 }
        order: { type: integer, description: 4 役割の注文の合計。 }
        inventory: { type: integer, description: 4 役割の在庫の合計。 }
        backlog: { type: integer, description: 4 役割の受注残の合計。 }
        hidden:
          type: boolean
          description: 値を出さない週なら true。
        reason:
          type: string
          enum: [CONTRIBUTORS_BELOW_MINIMUM]
    ObservationTotals:
      type: object
      required: [policy, weeks]
      properties:
        policy:
          type: string
          enum: [TEAM_TOTAL, NONE]
          description: 公開範囲（ゲームの作成時に決める）。
        hiddenReason:
          type: string
          enum: [DISCLOSURE_NONE]
          description: 合計を出さない理由。公開範囲が `NONE` のときだけ付く（`weeks` は空）。
        weeks:
          type: array
          items: { $ref: "#/components/schemas/ObservationWeek" }
    Observation:
      type: object
      description: |
        観察の内容（B9）。現在週・完了状況（入力済みの役割数）・チーム合計だけ。役割別の値・将来の需要・参加コード・入力者を含まない。
        `sessionStatus`・`week`・`submittedRoleCount` は、ゲームの開始後だけ付く。
      required: [gameId, status, finalWeek, totals, versions]
      properties:
        gameId: { type: string, format: uuid }
        status:
          type: string
          enum: [PREPARING, STARTED, ENDED]
        finalWeek: { type: integer }
        sessionStatus:
          type: string
          enum: [ACTIVE, PAUSED, ENDED]
        week: { type: integer, minimum: 1 }
        submittedRoleCount: { type: integer, minimum: 0, maximum: 4 }
        totals: { $ref: "#/components/schemas/ObservationTotals" }
        versions: { $ref: "#/components/schemas/StreamVersions" }
    Review:
      type: object
      description: 終了後の振り返り（B4）。全役割の全週の結果を、週・役割の順に並べる。需要は、小売店の `orders` と同じ値。
      required: [gameId, finalWeek, settingsKind, changedSettings, commitMode, results, versions]
      properties:
        gameId: { type: string, format: uuid }
        finalWeek: { type: integer }
        settingsKind: { $ref: "#/components/schemas/SettingsKind" }
        changedSettings:
          type: array
          items: { $ref: "#/components/schemas/SettingsField" }
        commitMode: { $ref: "#/components/schemas/CommitMode" }
        results:
          type: array
          items: { $ref: "#/components/schemas/RoleWeekResult" }
        versions: { $ref: "#/components/schemas/StreamVersions" }
    GameState:
      type: object
      description: 呼び出した人ごとの投影。進行役は `joinCode`・`finalWeek`、参加者は `participantId`・`role` を受け取る。
      required: [gameId, sessionId, status, settingsKind, changedSettings, commitMode, versions]
      properties:
        gameId: { type: string, format: uuid }
        sessionId:
          type:
            - string
            - "null"
          format: uuid
          description: このゲームでは gameId と同じ。開始前（PREPARING）は null。
        status:
          type: string
          enum: [PREPARING, STARTED, ENDED]
        settingsKind: { $ref: "#/components/schemas/SettingsKind" }
        changedSettings:
          type: array
          description: キットの値から変えた項目（`settingsKind` が `KIT` なら空）。進行役・参加者のどちらにも返す（値そのものは返さない）。
          items: { $ref: "#/components/schemas/SettingsField" }
        commitMode: { $ref: "#/components/schemas/CommitMode" }
        joinCode:
          type: string
          description: 進行役だけ。
        finalWeek:
          type: integer
          description: 進行役だけ。
        participantId:
          type: string
          format: uuid
          description: 参加者だけ（自分の ID）。
        role:
          $ref: "#/components/schemas/Role"
        versions: { $ref: "#/components/schemas/StreamVersions" }
    RoleStatus:
      type: object
      description: 役割別の状況（B1 で確定した項目名）。
      required: [inventory, backlog, arrivals, orders, decision, decisionVersion, decisionEditor, decisionSavedAt]
      properties:
        inventory: { type: integer }
        backlog: { type: integer }
        arrivals: { type: integer, description: 当週に処理する入荷 }
        orders: { type: integer, description: 当週の受注 }
        customerDemand:
          type: integer
          description: 小売店だけに含める、当週の顧客需要（AC2.1.3。他の役割には項目ごと含めない。将来の週の需要はどの応答にも含めない）。
        decision:
          type:
            - integer
            - "null"
          description: 当週の入力値（未入力は null）
        decisionVersion: { type: integer, minimum: 0 }
        decisionEditor:
          description: 当週の入力を最後に保存した人（B6 の提案。未入力は null）。表示名は同じ役割の共同担当と進行役にだけ示す。
          oneOf:
            - $ref: "#/components/schemas/DecisionEditor"
            - type: "null"
        decisionSavedAt:
          type: [string, "null"]
          format: date-time
          description: 当週の入力の保存の時刻（B6 の提案。未入力は null）。
    RoleWeekResult:
      type: object
      description: 確定した週の、役割別の結果。AC2.3.5 の例示（注文、在庫、受注残、出荷、費用）。費用は最小単位（セント）の整数。
      required: [role, week, orders, order, inventory, backlog, shipment, cost, cumulativeCost]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        week: { type: integer }
        orders: { type: integer, description: その週に受けた注文 }
        order: { type: integer, description: その週に発注（工場は生産要請）した数量 }
        inventory: { type: integer, description: 週末の在庫 }
        backlog: { type: integer, description: 週末の受注残 }
        shipment: { type: integer, description: その週の出荷 }
        cost: { type: integer, description: その週の費用（最小単位） }
        cumulativeCost: { type: integer, description: 累計の費用（最小単位） }
    ExportDocument:
      type: object
      description: |
        結果の出力（JSON。B10）。CSV と同じ記録から作るので、数量と費用が一致する。表示名・資格・参加コードを含まない。
        費用は最小単位の整数。`ordered` は、その週に確定した発注（工場は生産要請）の数量（意思決定）。
      required: [schemaVersion, gameId, finalWeek, settings, records]
      properties:
        schemaVersion: { type: string, description: 出力の形の版（`beer-game-kotlin.export.v1`） }
        gameId: { type: string, format: uuid }
        finalWeek: { type: integer }
        settings:
          type: object
          required: [kind, changes, commitMode]
          properties:
            kind: { $ref: "#/components/schemas/SettingsKind" }
            changes:
              type: array
              description: キットの値から変えた項目（`kind` が `KIT` なら空）。
              items: { $ref: "#/components/schemas/SettingsField" }
            commitMode: { $ref: "#/components/schemas/CommitMode" }
        records:
          type: array
          description: 1 週 × 1 役割ごとの記録（週の昇順、役割は上流から下流）。
          items:
            type: object
            required:
              [week, role, orders, shipped, ordered, endingInventory, endingBacklog, weeklyCostMinor, cumulativeCostMinor]
            properties:
              week: { type: integer }
              role: { $ref: "#/components/schemas/Role" }
              orders: { type: integer, description: その週に受けた注文 }
              shipped: { type: integer, description: その週の出荷 }
              ordered: { type: integer, description: その週に確定した発注（意思決定） }
              endingInventory: { type: integer, description: 週末の在庫 }
              endingBacklog: { type: integer, description: 週末の受注残 }
              weeklyCostMinor: { type: integer, description: その週の費用（最小単位） }
              cumulativeCostMinor: { type: integer, description: 累計の費用（最小単位） }
    SessionState:
      type: object
      description: 呼び出した人の役割に応じた投影。参加者は自分の役割の `roleStatus` だけを受け取る。進行役は `roles` と `results` を受け取る。
      required: [sessionId, status, week, submittedRoleCount, versions]
      properties:
        sessionId: { type: string, format: uuid, description: このゲームでは gameId と同じ }
        status:
          type: string
          enum: [ACTIVE, PAUSED, ENDED]
        week:
          type: integer
          description: 現在の週（第 1 週から）。最終週の確定後は終了。
        submittedRoleCount:
          type: integer
          description: 当週の入力が済んだ役割の数（チーム全体の集計値）。
        participantId:
          type: string
          format: uuid
          description: 参加者だけ（自分の ID）。
        role:
          $ref: "#/components/schemas/Role"
        finalWeek:
          type: integer
          description: 進行役だけ。
        roleStatus: { $ref: "#/components/schemas/RoleStatus" }
        coHolders:
          type: array
          description: 参加者だけ（B6 の提案）。同じ役割の共同担当（自分を含む。入れ替えで外れた旧担当者は含めない）。他の役割の担当者は含めない。
          items: { $ref: "#/components/schemas/CoHolder" }
        roles:
          type: object
          description: 進行役だけ。役割ごとの状況。
          additionalProperties: { $ref: "#/components/schemas/RoleStatus" }
        results:
          type: array
          description: 進行役だけ。確定した週の、役割別の結果。
          items: { $ref: "#/components/schemas/RoleWeekResult" }
        versions: { $ref: "#/components/schemas/StreamVersions" }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
