services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beer_game
      POSTGRES_USER: beer_game
      POSTGRES_PASSWORD: local-only
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beer_game']
      interval: 2s
      timeout: 2s
      retries: 15
