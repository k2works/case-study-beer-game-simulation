// 境界（受け入れテストのステップ定義と実行器）用。IO の実行（unsafeRun*）だけを許す。
// ほかの規則（標準出力・時計・スリープ・トランザクションの入口）は、本体と同じように守る。
rules = [DisableSyntax]

DisableSyntax.regex = [
  {
    id = "println"
    pattern = "(?<![.\\w])(?<!def )println\\("
    message = "標準出力は IO.println で IO にする"
  }
  {
    id = "clock"
    pattern = "System\\.(currentTimeMillis|nanoTime)\\("
    message = "時計は IO.realTime で受け取る"
  }
  {
    id = "threadSleep"
    pattern = "Thread\\.sleep\\("
    message = "Thread.sleep の代わりに IO.sleep を使う"
  }
  {
    id = "transact"
    pattern = "\\.(transact|trans|rawTrans)(\\(|\\[)"
    message = "トランザクションの入口は Transactions.scala だけ。Tx.run を使う"
  }
  {
    id = "txControl"
    pattern = "\\b(FC|HC)\\.(commit|rollback)\\b"
    message = "COMMIT・ROLLBACK の制御は Transactions.scala だけ"
  }
]
