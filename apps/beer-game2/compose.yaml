services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: beer_game2
      POSTGRES_USER: beer_game2
      POSTGRES_PASSWORD: local-only
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beer_game2']
      interval: 2s
      timeout: 2s
      retries: 15
